  <script>
    const docsData = {"00-project-overview.md": "# Smart Canteen FEB\n\n## Project Constraint\n\nBudget: Rp1.000.000\nType: Dummy / Demo\nEstimated Development: 5–7 working days\n\n## Primary Objective\n\nMembangun website demo Smart Canteen FEB yang memperlihatkan alur:\n\nMahasiswa\n→ Pilih Tenant\n→ Pilih Menu\n→ Keranjang\n→ Checkout\n→ Pembayaran\n→ Tenant Memproses\n→ Pesanan Siap\n→ Self-Pickup\n\n## AI Development Principle\n\n> Implement only what is required by the documented scope.\n\nThe AI MUST NOT expand the project scope autonomously.\n\nBefore implementing a feature, the AI should verify that the feature exists\nin the project documentation.\n\nIf the feature is not documented, classify it as:\n\nOUT OF SCOPE\n\nand do not implement it without explicit approval.\n\n## Priority\n\n1. Scope\n2. Functional requirements\n3. User flow\n4. Acceptance criteria\n5. UI/UX\n6. Technical implementation\n\nTechnical complexity must never override the project scope.", "01-scope.md": "# Project Scope — Smart Canteen FEB\n\n## 1. Informasi Proyek\n\n**Nama Proyek:** Smart Canteen FEB\n**Jenis:** Website Dummy / Demo\n**Budget:** Rp1.000.000\n**Estimasi Pengerjaan:** 5–7 hari kerja\n\nDokumen ini menjadi **batas utama pengembangan proyek**.\n\nSeluruh implementasi harus mengikuti scope yang tercantum di dokumen ini.\n\n---\n\n## 2. Tujuan Proyek\n\nSmart Canteen FEB adalah website demo yang digunakan untuk memperlihatkan konsep pemesanan makanan/minuman di lingkungan FEB dengan dukungan opsi pembayaran **Cashless (Midtrans Sandbox)** dan **Cash (Tunai dengan Scan QR/Kode oleh Tenant)**, penataan menu ber-kategori, serta keamanan data historis melalui **Soft Deletes**.\n\nTujuan utama website:\n\n* Menampilkan tenant/kantin.\n* Menampilkan menu ber-kategori yang tersedia.\n* Memungkinkan mahasiswa membuat pesanan.\n* Menampilkan proses checkout (Pilihan **Cashless** vs **Cash**).\n* Menampilkan simulasi/alur pembayaran Cashless (Midtrans Sandbox) dan Cash (Scan Kode oleh Tenant).\n* Memungkinkan tenant memproses pesanan.\n* Menampilkan status pesanan sampai siap diambil.\n* Menunjukkan konsep **Self-pickup**.\n* Menerapkan **Soft Deletes** pada entity krusial (Users, Tenants, Menus, Orders) untuk integritas riwayat transaksi.\n\nWebsite ini **BUKAN sistem kantin production**.\n\nFokus utama adalah **UI, UX, dan demonstrasi alur bisnis utama**.\n\n---\n\n## 3. Aktor Sistem\n\nSistem hanya memiliki tiga jenis pengguna:\n\n### 3.1 Mahasiswa\n\nMahasiswa dapat:\n\n* Login / mengakses akun.\n* Melihat daftar tenant.\n* Melihat menu tenant berdasarkan kategori.\n* Melihat detail menu.\n* Menambahkan menu ke keranjang.\n* Mengubah isi keranjang.\n* Melakukan checkout (Pilih **Cashless** atau **Cash**).\n* Mendapatkan Kode QR / Kode Pengambilan pesanan.\n* Melakukan simulasi pembayaran Cashless atau menampilkan Kode ke Tenant untuk bayar Cash.\n* Melihat status pesanan dan tracker timeline.\n* Melihat riwayat pesanan.\n* Melihat informasi pengambilan pesanan (**Self-Pickup**).\n\n### 3.2 Tenant / Penjual\n\nTenant dapat:\n\n* Login ke dashboard.\n* Melihat pesanan masuk.\n* Menampilkan scanner / input kode pesanan untuk **Konfirmasi Pembayaran Cash**.\n* Melihat detail pesanan.\n* Mengubah status pesanan (`Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).\n* Mengelola kategori menu.\n* Menambahkan, mengubah, menghapus menu (dengan **Soft Deletes**).\n* Mengatur ketersediaan menu (Toggle Stock).\n\n### 3.3 Admin\n\nAdmin dapat:\n\n* Login ke dashboard admin.\n* Melihat statistik demo.\n* Mengelola data tenant (Tambah, Edit, Hapus via **Soft Deletes**).\n* Mengelola pengguna & role (Mahasiswa, Tenant, Admin dengan **Soft Deletes**).\n* Melihat & memantau seluruh transaksi kantin.\n\n---\n\n## 4. Scope Pembayaran & Verifikasi\n\n### 4.1 Cashless (Midtrans Sandbox)\n```mermaid\nflowchart TD\n    Checkout[\"Mahasiswa Checkout Cashless\"] --> Snap[\"Tampil Pop-up Midtrans Sandbox\"]\n    Snap --> Simulator[\"Bayar via Midtrans Simulator\"]\n    Simulator --> Webhook[\"Callback Webhook Midtrans\"]\n    Webhook --> Paid[\"Status: Dibayar\"]\n    Paid --> TenantDashboard[\"Tampil di Tenant Dashboard\"]\n```\n\n### 4.2 Cash (Tunai di Stand Tenant)\n```mermaid\nflowchart TD\n    Checkout[\"Mahasiswa Checkout Cash\"] --> GenCode[\"Generate QR / Kode Pengambilan\"]\n    GenCode --> Pending[\"Status: Menunggu Pembayaran Tunai\"]\n    Pending --> Stand[\"Mahasiswa Datang ke Stand Tenant\"]\n    Stand --> Scan[\"Tenant Scan QR / Input Kode di App Tenant\"]\n    Scan --> Confirm[\"Tenant Terima Uang & Klik Konfirmasi\"]\n    Confirm --> Paid[\"Status: Dibayar\"]\n    Paid --> Process[\"Tenant Memproses Pesanan\"]\n```\n\n---\n\n## 5. Scope Data & Soft Deletes\n\nData krusial menggunakan fitur **Soft Deletes (`deleted_at`)**:\n1. `users`: Jika akun dinonaktifkan/dihapus, riwayat transaksi pesanan historis tetap utuh.\n2. `tenants`: Jika tenant tutup/dihapus, riwayat belanja mahasiswa tidak hilang.\n3. `menus`: Jika menu dihapus dari katalog tenant, pesanan lama tetap menampilkan nama dan harga menu tersebut (Snapshot Data).\n4. `orders`: Pesanan yang dibatalkan/dihapus tetap tersimpan secara soft delete untuk transparansi demo.\n\n---\n\n## 6. Alur Bisnis Utama\n\nAlur utama yang **WAJIB dapat didemokan**:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor M as Mahasiswa\n    participant SYS as \"Sistem Smart Canteen\"\n    participant MID as \"Midtrans Sandbox\"\n    actor T as Tenant\n\n    M->>SYS: Login dan Pilih Tenant / Menu\n    M->>SYS: Checkout (Pilih Cashless / Cash)\n    alt Metode Cashless\n        SYS->>MID: Request Snap Token\n        MID-->>M: Tampilkan Midtrans Pop-up Sandbox\n        M->>MID: Selesaikan Bayar di Sandbox\n        MID-->>SYS: Callback Auto Webhook\n        SYS->>SYS: Update Status: Dibayar\n    else Metode Cash (Tunai)\n        SYS-->>M: Generate Kode QR / Pengambilan\n        M->>T: Tunjukkan Kode QR dan Uang Tunai di Stand\n        T->>SYS: Scan QR / Input Kode Pesanan -> Konfirmasi Bayar\n        SYS->>SYS: Update Status: Dibayar\n    end\n    SYS-->>T: Pesanan Masuk di Dashboard\n    T->>SYS: Update Status: Diproses\n    T->>SYS: Update Status: Siap Diambil\n    M->>T: Datang Ambil Pesanan (Self-Pickup)\n    T->>SYS: Update Status: Selesai\n```\n\n---\n\n## 7. Definition of Done\n\nProyek dianggap memenuhi scope apabila:\n* Mahasiswa dapat memesan dengan opsi **Cashless** (Midtrans Sandbox) maupun **Cash** (Scan QR oleh Tenant).\n* Tenant dapat melakukan **Scan Kode QR / Input Kode** untuk menerima bayar tunai.\n* Data `users`, `tenants`, `menus`, dan `orders` menerapkan **Soft Deletes**.\n* Menu terkelola dalam **Kategori Menu**.\n* Core flow dapat didemonstrasikan dari awal sampai selesai tanpa error.\n", "02-requirements.md": "# Functional & Non-Functional Requirements — Smart Canteen FEB\n\n## 1. Requirements Overview\n\nDokumen ini mendefinisikan kebutuhan fungsional (Functional Requirements) dan non-fungsional (Non-Functional Requirements) dari sistem Smart Canteen FEB berdasarkan [01-scope.md](file:///home/darbi/Projects/smart_canteen/docs/01-scope.md).\n\n---\n\n## 2. Functional Requirements (FR)\n\n### 2.1 Modul Mahasiswa (Customer)\n* **FR-MHS-01:** Mahasiswa dapat melakukan login dan logout.\n* **FR-MHS-02:** Mahasiswa dapat melihat daftar tenant dan filter menu berdasarkan kategori (Makanan, Minuman, Camilan).\n* **FR-MHS-03:** Mahasiswa dapat melihat detail menu (nama, harga, foto, ketersediaan).\n* **FR-MHS-04:** Mahasiswa dapat mengelola keranjang belanja (cart).\n* **FR-MHS-05:** Mahasiswa dapat memilih metode pembayaran di Checkout: **Cashless** (Midtrans Sandbox) atau **Cash** (Tunai di Stand).\n* **FR-MHS-06:** Mahasiswa mendapatkan **Kode QR / Kode Pengambilan** unik untuk setiap transaksi.\n* **FR-MHS-07:** Mahasiswa dapat memantau live status pesanan (`Menunggu Pembayaran` → `Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).\n* **FR-MHS-08:** Mahasiswa dapat melihat riwayat pesanan (historis tetap aman meskipun menu/tenant di-soft delete).\n\n### 2.2 Modul Tenant (Penjual)\n* **FR-TNT-01:** Tenant dapat login ke dashboard tenant.\n* **FR-TNT-02:** Tenant dapat melakukan **Scan Kode QR / Input Kode Pesanan** mahasiswa untuk mengonfirmasi pembayaran Tunai (Cash).\n* **FR-TNT-03:** Tenant dapat melihat ringkasan & detail pesanan masuk.\n* **FR-TNT-04:** Tenant dapat memperbarui status pesanan (`Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).\n* **FR-TNT-05:** Tenant dapat mengelola Kategori Menu & Item Menu (Tambah, Edit, Soft Delete, Toggle Stok Available/Out of Stock).\n\n### 2.3 Modul Admin (Pengelola)\n* **FR-ADM-01:** Admin dapat login ke dashboard admin.\n* **FR-ADM-02:** Admin dapat melihat statistik demo (Total Tenant, Total User, Total Transaksi, Transaksi Cash vs Cashless).\n* **FR-ADM-03:** Admin dapat mengelola data tenant (CRUD + Soft Delete).\n* **FR-ADM-04:** Admin dapat mengelola pengguna & role (CRUD + Soft Delete).\n* **FR-ADM-05:** Admin dapat memantau seluruh transaksi kantin secara global.\n\n---\n\n## 3. Non-Functional Requirements (NFR)\n\n### 3.1 Data Integrity & Soft Deletes\n* **NFR-01:** Menerapkan `softDeletes` (`deleted_at`) pada `users`, `tenants`, `menus`, dan `orders` untuk menjaga integritas data historis.\n* **NFR-02:** Menggunakan snapshot nama & harga menu pada `order_items` saat transaksi terjadi.\n\n### 3.2 Performance & Usability\n* **NFR-03:** Layout responsive (Mobile-first untuk Mahasiswa, Desktop/Mobile friendly untuk Tenant & Admin).\n* **NFR-04:** Respon verifikasi scan QR / kode tunai di stand tenant berjalan instan (< 1 detik).\n", "03-user-flow.md": "# User Flow — Smart Canteen FEB\n\n## 1. Core End-to-End Business Flow\n\nAlur utama pemesanan dengan opsi **Cashless (Midtrans Sandbox)** dan **Cash (Scan QR / Kode di Tenant)** disajikan dalam diagram Mermaid berikut:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor M as Mahasiswa\n    participant SYS as \"Sistem Smart Canteen\"\n    participant MID as \"Midtrans Sandbox\"\n    actor T as Tenant\n\n    M->>SYS: Login dan Lihat Menu per Kategori\n    M->>SYS: Tambah ke Keranjang lalu Checkout\n    M->>SYS: Pilih Metode Pembayaran (Cashless / Cash)\n    \n    alt Pembayaran Cashless\n        SYS->>MID: Request Midtrans Snap Token\n        MID-->>M: Tampilkan Midtrans Sandbox Pop-up\n        M->>MID: Selesaikan Bayar di Sandbox\n        MID-->>SYS: Webhook Auto Callback Success\n        SYS->>SYS: Status Pesanan: Dibayar\n    else Pembayaran Cash (Tunai)\n        SYS-->>M: Tampilkan Kode QR / Kode Pengambilan\n        M->>T: Tunjukkan Kode QR dan Serahkan Uang Tunai di Stand\n        T->>SYS: Scan QR / Input Kode di App Tenant\n        T->>SYS: Klik Konfirmasi Terima Tunai\n        SYS->>SYS: Status Pesanan: Dibayar\n    end\n\n    SYS-->>T: Pesanan Masuk di Dashboard Tenant\n    T->>SYS: Ubah Status: Diproses\n    T->>SYS: Ubah Status: Siap Diambil\n    SYS-->>M: Live Tracker Update: Siap Diambil\n    M->>T: Ambil Makanan di Stand (Self-Pickup)\n    T->>SYS: Konfirmasi Selesai: Status Selesai\n```\n\n---\n\n## 2. Detail Alur Pembayaran Cash (Scan QR oleh Tenant)\n\n```mermaid\nflowchart TD\n    A[\"Mahasiswa Checkout Pilih Cash\"] --> B[\"Sistem Generate pickup_code & QR\"]\n    B --> C[\"Status Order: Menunggu Pembayaran Tunai\"]\n    C --> D[\"Mahasiswa Datang ke Stand Tenant\"]\n    D --> E[\"Tenant Buka Scanner / Input Form di App Tenant\"]\n    E --> F[\"Tenant Scan QR / Ketik Kode Pesanan\"]\n    F --> G[\"Tampil Detail Tagihan & Item Pesanan\"]\n    G --> H[\"Tenant Terima Uang & Klik Konfirmasi Pembayaran\"]\n    H --> I[\"Status Order Berubah: Dibayar\"]\n    I --> J[\"Tenant Langsung Memproses Pesanan\"]\n```\n", "04-user-roles.md": "# User Roles & Permissions — Smart Canteen FEB\n\n## 1. Definisi Role\n\nSistem Smart Canteen FEB menggunakan 3 role utama via **Spatie Laravel Permission**:\n\n1. `mahasiswa` (Customer)\n2. `tenant` (Penjual / Stand FEB)\n3. `admin` (Pengelola System)\n\n---\n\n## 2. Hak Akses & Matriks Permisi\n\n| Fitur / Halaman | Mahasiswa | Tenant | Admin |\n| :--- | :---: | :---: | :---: |\n| **Login / Logout** | ✅ | ✅ | ✅ |\n| **Melihat Tenant & Menu per Kategori** | ✅ | ✅ | ✅ |\n| **Tambah ke Cart & Checkout (Cashless / Cash)** | ✅ | ❌ | ❌ |\n| **Mendapatkan Kode QR / Kode Pengambilan** | ✅ | ❌ | ❌ |\n| **Scan QR / Input Kode Pembayaran Cash** | ❌ | ✅ | ❌ |\n| **Kelola Status Pesanan (`Dibayar` → `Selesai`)** | ❌ | ✅ | ❌ |\n| **Kelola Kategori & Menu (CRUD + Soft Delete)** | ❌ | ✅ | ❌ |\n| **Dashboard Admin & Supervision** | ❌ | ❌ | ✅ |\n| **Kelola Tenant (CRUD + Soft Delete)** | ❌ | ❌ | ✅ |\n| **Kelola User (CRUD + Soft Delete)** | ❌ | ❌ | ✅ |\n\n---\n\n## 3. Aturan Soft Delete Permisi\n* Tenant atau Admin yang melakukan penghapusan data (User, Tenant, Menu) hanya melakukan Soft Delete (`deleted_at`), sehingga tidak menghapus data secara permanen dan menjaga integritas tabel transaksi `orders` & `order_items`.\n", "05-feature-specification.md": "# Feature Specification — Smart Canteen FEB\n\nDokumen ini mendefinisikan seluruh spesifikasi fitur fungsional aplikasi Smart Canteen FEB sesuai dengan implementasi terkini.\n\n---\n\n## 1. Modul Mahasiswa (Customer)\n\n### 1.1 Auth & Account Management\n* **F-MHS-01 Registrasi & Login Mahasiswa:** Form autentikasi credentials mahasiswa dengan dukungan pengingat sesi (*Remember Me*) dan batas kata sandi minimal 8 karakter.\n* **F-MHS-02 Quick Role Switcher Demo:** Utility switcher role instant pada header/navigasi untuk kemudahan saat presentasi demo.\n* **F-MHS-03 Profil & Keamanan Akun:** Edit nama, email, foto profil (`/settings/profile`), ubah kata sandi, dan Two-Factor Authentication (2FA) (`/settings/security`).\n\n### 1.2 Katalog & Pemesanan Makanan\n* **F-MHS-04 Katalog Tenant & Filter Kategori:** Halaman utama (`/catalog`) menampilkan promo banner carousel, daftar stand kantin, dan filter kategori global (*Makanan Utama*, *Minuman*, *Camilan*).\n* **F-MHS-05 Detail Stand Kantin:** Halaman profil stand (`/{tenant:slug}`) menampilkan banner header, logo, jam operasional, status buka/tutup, ulasan bintang, dan menu khusus stand.\n* **F-MHS-06 Modal Detail Menu & Catatan Pesanan:** Tampilan modal hidangan berukuran besar, pengatur kuantitas porsi (`+`/`-`), dan input teks catatan khusus pesanan ke penjual.\n* **F-MHS-07 Floating Cart Bar & Multi-Stand Checkout:** Bilah keranjang melayang di bawah layar saat item > 0, dan halaman checkout (`/checkout`) yang mendukung pengelompokan pesanan multi-stand.\n\n### 1.3 Pembayaran & Tracking Status\n* **F-MHS-08 Dual Payment Engine:**\n  - **Cashless Digital (Midtrans Sandbox):** Integrasi Snap Pop-up dengan simulasi BCA Virtual Account ([Simulator BCA VA](https://simulator.sandbox.midtrans.com/bca/va/index)) dan QRIS ([Simulator QRIS](https://simulator.sandbox.midtrans.com/v2/qris/index)).\n  - **Tunai / Cash:** Digital Pickup Pass dengan gambar Kode QR, string unik `FEB-XXXX`, dan hitung mundur timer bayar 15 menit.\n* **F-MHS-09 Live Status Tracker Real-Time:** Stepper visual 5-tahap (`Menunggu Pembayaran` ➔ `Dibayar` ➔ `Diproses` ➔ `Siap Diambil` ➔ `Selesai`) dengan timestamp audit instan.\n* **F-MHS-10 Rating & Ulasan Menu:** Pemberian bintang 1–5 ⭐ dan ulasan rasa/pelayanan setelah pesanan di-pickup (`/orders/{order}/rate`).\n* **F-MHS-11 Riwayat Transaksi & Re-Order:** Halaman riwayat pesanan (`/orders`, `/orders/history`) lengkap dengan invoice digital dan tombol *Pesan Lagi*.\n\n---\n\n## 2. Modul Tenant (Pemilik Stand)\n\n### 2.1 Dashboard & Operasional Stand\n* **F-TNT-01 Tenant Metric Dashboard:** Overview pendapatan hari ini, jumlah pesanan aktif per status, rasio Cash vs Cashless, dan grafik penjualan (`/tenant/dashboard`).\n* **F-TNT-02 Quick Toggle Status Stand:** Saklar instant untuk mengubah status *Buka / Tutup Stand* (`is_open`).\n* **F-TNT-03 Pengaturan Profil Stand:** Mengunggah foto banner header, foto logo, nomor telepon, deskripsi, dan jam operasional (`/tenant/settings`).\n\n### 2.2 Order Board & Verifikasi QR Tunai\n* **F-TNT-04 Kitchen Order Board & Kanban:** Papan kontrol pesanan masuk (`/tenant/orders`) berbasis tab status dengan aksi update cepat (`🍳 Mulai Proses` ➔ `🔔 Siap Diambil` ➔ `✅ Tandai Selesai`).\n* **F-TNT-05 Cash QR Code Scanner & Code Verifier:** Fitur kamera scan QR Code / input manual kode `FEB-XXXX` di kasir stand (`/tenant/verify-payment`) untuk memverifikasi pembayaran tunai.\n\n### 2.3 Manajemen Kategori, Menu & Ulasan\n* **F-TNT-06 Manajemen Kategori Menu:** CRUD pengelompokan menu internal stand (`/tenant/categories`).\n* **F-TNT-07 Manajemen Katalog Menu (CRUD + Soft Delete):** Menambah, mengubah foto, harga, estimasi waktu penyajian, varian opsi, tag *Best Seller*, dan saklar stok instant (*Available / Out of Stock*) (`/tenant/menus`).\n* **F-TNT-08 Fitur Sampah (Restore Data):** Pemulihan data menu yang tidak sengaja terhapus via fitur Soft Delete.\n* **F-TNT-09 Ulasan & Rating Pembeli:** Melihat daftar ulasan bintang dan testimoni pembeli (`/tenant/ratings`).\n\n---\n\n## 3. Modul Admin (Administrator System)\n\n### 3.1 Pengawasan Global & Metric\n* **F-ADM-01 Admin Dashboard Supervision:** Monitoring total omset kantin FEB, jumlah stand aktif, total user, rasio metode pembayaran, dan statistik transaksi (`/admin/dashboard`).\n* **F-ADM-02 Global Order Supervision:** Monitoring seluruh transaksi kantin secara global dengan filter tanggal, stand, dan status (`/admin/orders`).\n\n### 3.2 Master Data & Settings\n* **F-ADM-03 Master Data Tenant Management:** CRUD data stand tenant dilengkapi dengan Soft Delete & Restore (`/admin/tenants`).\n* **F-ADM-04 Master Data User & Role Management:** CRUD pengguna, manajemen role (*Mahasiswa*, *Tenant*, *Admin*), dan Soft Delete & Restore (`/admin/users`).\n* **F-ADM-05 Master Payment Settings & Fee:** Pengaturan saluran pembayaran aktif dan biaya layanan aplikasi / Admin Fee (`/admin/payment-settings`).\n", "06-page-specification.md": "# Page Specification — Smart Canteen FEB\n\nDokumen ini mendeskripsikan seluruh halaman dalam sistem beserta komponen, rute Inertia React, layout, dan interaksinya.\n\n---\n\n## 1. Halaman Mahasiswa (Customer)\n\n### 1.1 Halaman Katalog Kantin (`/catalog` atau `/`)\n* **Rute / Component:** `resources/js/pages/catalog.tsx` (atau `catalog/index.tsx`)\n* **Elemen:** Promo Banner Carousel, Live Search Bar, Chips Filter Kategori Global (*Makanan Utama*, *Minuman*, *Camilan*), Kartu Stand Kantin (Rating, Status Buka/Tutup), Grid Kartu Menu Hidangan, Floating Cart Bar.\n* **Aksi:** Ketik pencarian, filter kategori, klik stand untuk detail, klik menu untuk modal detail, klik checkout.\n\n### 1.2 Halaman Detail Stand Tenant (`/{tenant:slug}`)\n* **Rute / Component:** `resources/js/pages/tenant-detail.tsx`\n* **Elemen:** Header Banner Cover Stand, Foto Logo, Nama Stand, Jam Operasional, Rating Bintang & Total Ulasan, Chips Kategori Internal Stand, Grid Menu Stand.\n\n### 1.3 Halaman Checkout (`/checkout`)\n* **Rute / Component:** `resources/js/pages/checkout/index.tsx`\n* **Elemen:** Rincian Item per Stand, Edit Jumlah / Hapus Item, Input Catatan Khusus, Ringkasan Pembayaran (Subtotal, Biaya Admin, Total Tagihan), Radio Button Metode Pembayaran (Cashless Midtrans vs Cash Tunai), Opsi Santap (*Dine In* / *Takeaway*), Tombol \"Buat Pesanan\".\n\n### 1.4 Halaman Pembayaran & Digital Pickup Pass (`/orders/{order}/payment`)\n* **Rute / Component:** `resources/js/pages/orders/payment.tsx` & `resources/js/pages/orders/show.tsx`\n* **Elemen:**\n  - **Cashless:** Tombol Buka Pop-up Midtrans Snap + Petunjuk Link Simulator BCA VA / QRIS.\n  - **Tunai:** Pass Pengambilan Digital (Gambar QR Code besar, Kode Pengambilan `FEB-XXXX`, Hitung Mundur 15 Menit).\n\n### 1.5 Halaman Live Order Tracker (`/orders/{order}`)\n* **Rute / Component:** `resources/js/pages/orders/show.tsx`\n* **Elemen:** Visual Timeline Stepper 5-Tahap (`Menunggu Pembayaran` ➔ `Dibayar` ➔ `Diproses` ➔ `Siap Diambil` ➔ `Selesai`), Notifikasi Berkedip (*Pulsing Green*) saat Siap Di-pickup, Detail Item Pesanan, Audit Timestamps (`paid_at`, `processing_at`, `ready_at`, `completed_at`).\n\n### 1.6 Halaman Riwayat Pesanan (`/orders` & `/orders/history`)\n* **Rute / Component:** `resources/js/pages/orders/index.tsx` & `orders/history.tsx`\n* **Elemen:** Tab *Pesanan Aktif* vs *Riwayat Selesai*, Kartu Transaksi, Invoice Digital, Tombol *Beri Ulasan*, Tombol *Pesan Lagi*.\n\n### 1.7 Halaman Pengaturan Akun (`/settings/*`)\n* **Rute / Component:** `resources/js/pages/settings/profile.tsx`, `security.tsx`, `appearance.tsx`\n* **Elemen:** Form Edit Profil & Foto Avatar, Form Ubah Password, Panel Two-Factor Authentication (2FA), Saklar Mode Gelap / Mode Terang.\n\n---\n\n## 2. Halaman Tenant (Pemilik Stand)\n\n### 2.1 Tenant Dashboard (`/tenant/dashboard`)\n* **Rute / Component:** `resources/js/pages/tenant/dashboard.tsx`\n* **Elemen:** Metric Card (Omset Hari Ini, Pesanan Masuk, Rasio Bayar), Quick Saklar *Status Buka/Tutup Stand*, Grafik Penjualan, Tabel Preview Pesanan Terbaru.\n\n### 2.2 Kelola Pesanan & Kitchen Kanban Board (`/tenant/orders`)\n* **Rute / Component:** `resources/js/pages/tenant/orders.tsx`\n* **Elemen:** Tab Status Pesanan (*Masuk*, *Diproses*, *Siap Diambil*), Papan Kanban Dapur, Tombol Aksi Cepat (`🍳 Mulai Proses`, `🔔 Siap Diambil`, `✅ Tandai Selesai`), Detail Item & Catatan Pembeli.\n\n### 2.3 Cash QR Code Scanner & Verifier (`/tenant/verify-payment`)\n* **Rute / Component:** `resources/js/pages/tenant/verify-payment.tsx`\n* **Elemen:** Pemindai Kamera QR Code, Kolom Input Teks Kode `FEB-XXXX`, Kartu Ringkasan Tagihan Pembeli, Tombol \"💵 Konfirmasi Pembayaran Tunai\".\n\n### 2.4 Manajemen Kategori & Menu (`/tenant/menus`, `/tenant/categories`)\n* **Rute / Component:** `resources/js/pages/tenant/menus.tsx`, `menus/create.tsx`, `menus/edit.tsx`, `categories.tsx`\n* **Elemen:** Tabel Data Kategori & Menu, Form Tambah/Edit Menu (Foto, Nama, Harga, Varian, Tag Best Seller, Estimasi Waktu), Saklar Stok Instant (*Available/Out of Stock*), Action Soft Delete & Restore dari Sampah.\n\n### 2.5 Halaman Ulasan & Pengaturan Stand (`/tenant/ratings`, `/tenant/settings`)\n* **Rute / Component:** `resources/js/pages/tenant/ratings.tsx`, `settings.tsx`\n* **Elemen:** Daftar Ulasan Bintang & Komentar Pembeli, Form Edit Profile Stand (Banner Cover, Logo, Telepon, Jam Operasional).\n\n---\n\n## 3. Halaman Admin (Administrator System)\n\n### 3.1 Admin Metric Dashboard (`/admin/dashboard`)\n* **Rute / Component:** `resources/js/pages/admin/dashboard.tsx`\n* **Elemen:** Metric Cards (Total Omset Kantin, Volume Transaksi, Stand Aktif, Total User), Grafik Penjualan Harian, Combobox Filter Tenant.\n\n### 3.2 Master Data Stand Tenant (`/admin/tenants`)\n* **Rute / Component:** `resources/js/pages/admin/tenants.tsx`\n* **Elemen:** Data Table Stand Tenant, Modal Tambah/Edit Stand, Dialog Non-aktifkan Stand, Soft Delete & Restore.\n\n### 3.3 Master Data Pengguna & Role (`/admin/users`)\n* **Rute / Component:** `resources/js/pages/admin/users.tsx`\n* **Elemen:** Data Table User, Modal Tambah User, Dialog Ubah Role (*Mahasiswa*, *Tenant*, *Admin*), Soft Delete & Restore.\n\n### 3.4 Monitoring Pesanan Global (`/admin/orders`)\n* **Rute / Component:** `resources/js/pages/admin/orders.tsx`\n* **Elemen:** Data Table Transaksi Global Kantin, Filter Tanggal & Stand, Dialog Detail Invoice.\n\n### 3.5 Pengaturan Pembayaran & Biaya (`/admin/payment-settings`)\n* **Rute / Component:** `resources/js/pages/admin/payment-settings/index.tsx`\n* **Elemen:** Form Kunci Midtrans Gateway, Daftar Saluran Pembayaran Aktif, Input Biaya Layanan Aplikasi (Admin Fee).\n", "07-ui-ux-guidelines.md": "# UI/UX Guidelines — Smart Canteen FEB\n\n## 1. Core Design Principles\n\nSmart Canteen FEB mengutamakan tampilan yang modern, segar, konsisten, dan memukau (WOW factor) serta dioptimalkan untuk performa demonstrasi demo.\n\n* **Clean & Modern Aesthetic:** Menggunakan palette warna harmonis, rounded corners, subtle shadows, dan tipografi yang jelas.\n* **Mobile-First & Responsive:** Antarmuka harus tampil sempurna di layar Smartphone (Mahasiswa yang memesan di kantin) maupun Desktop (Dashboard Admin & Tenant).\n* **Clear Feedback & States:** Setiap aksi pengguna (klik tombol, ubah kuantitas, update status) memberikan respon visual yang seketika.\n\n---\n\n## 2. Palette Warna & Visual System\n\n* **Primary Color:** Emerald / Teal / Modern Green (Merepresentasikan kebersihan, kesegaran kantin, dan kemudahan).\n* **Secondary / Accent:** Warm Amber / Orange (Merepresentasikan makanan & kehangatan).\n* **Neutral Tones:** Dark Slate / Charcoal untuk teks, Light Gray / Ice White untuk background card.\n* **Status Badges:**\n  - `Menunggu Pembayaran`: Yellow / Amber Badge\n  - `Dibayar` / `Diproses`: Blue / Indigo Badge\n  - `Siap Diambil`: Emerald / Green Pulse Badge\n  - `Selesai`: Neutral Gray Badge\n  - `Pembayaran Gagal`: Red Badge\n\n---\n\n## 3. Component & Interactive States\n\nSetiap komponen UI harus mengimplementasikan 4 state utama:\n\n1. **Default State:** Tampilan bersih dengan hirarki visual yang jelas.\n2. **Loading State:** Skeleton loader / pulsing animation saat memuat data atau memproses transaksi.\n3. **Empty State:** Ilustrasi / pesan ramah jika keranjang kosong, riwayat kosong, atau tidak ada pesanan masuk.\n4. **Error / Validation State:** Message error yang informatif jika terjadi kesalahan input atau kegagalan simulasi pembayaran.\n\n---\n\n## 4. Feedback & Notifications\n\n* **Toast Notification:** Pop-up kecil di sudut layar saat pengguna menambahkan item ke keranjang atau berhasil mengubah status pesanan.\n* **Confirmation Modals:** Modal konfirmasi sebelum menghapus item dari keranjang atau melakukan aksi pembatalan.\n* **Progress Trackers:** Stepper visual yang hidup pada halaman detail pesanan mahasiswa untuk memperlihatkan tahap **Self-Pickup**.\n", "08-data-model.md": "# Data Model & Schema — Smart Canteen FEB\n\nDokumen ini mendefinisikan struktur basis data lengkap yang disesuaikan dengan seluruh **skema migrasi database aktif**, termasuk **Soft Deletes**, **Metode Pembayaran Cash vs Cashless**, **Kode QR**, **Kategori Tenant & Global**, **Rating & Ulasan**, **Pengaturan Aplikasi**, dan **Snapshot Data Pesanan**.\n\n---\n\n## 1. Entity Relationship Diagram (ERD)\n\n```mermaid\nerDiagram\n    USERS ||--o{ ORDERS : \"places\"\n    TENANTS ||--o{ MENUS : \"owns\"\n    TENANTS ||--o{ CATEGORIES : \"owns\"\n    TENANTS ||--o{ ORDERS : \"receives\"\n    TENANTS ||--o{ TENANT_RATINGS : \"receives_reviews\"\n    CATEGORIES ||--o{ MENUS : \"classifies\"\n    USERS ||--o{ TENANT_RATINGS : \"writes_reviews\"\n    ORDERS ||--|{ ORDER_ITEMS : \"contains\"\n    ORDERS ||--o{ TENANT_RATINGS : \"rated_in\"\n    MENUS ||--o{ ORDER_ITEMS : \"referenced_by\"\n\n    USERS {\n        bigint id PK\n        string name\n        string email UK\n        string password\n        bigint tenant_id FK\n        text two_factor_secret\n        timestamp deleted_at\n        timestamp created_at\n    }\n\n    TENANTS {\n        bigint id PK\n        string name\n        string slug UK\n        text description\n        string image\n        string banner_image\n        string logo_image\n        string phone\n        string opening_hours\n        boolean is_active\n        boolean is_open\n        decimal rating\n        integer reviews_count\n        timestamp deleted_at\n        timestamp created_at\n    }\n\n    CATEGORIES {\n        bigint id PK\n        bigint tenant_id FK\n        string name\n        string slug\n        timestamp created_at\n    }\n\n    MENUS {\n        bigint id PK\n        bigint tenant_id FK\n        bigint category_id FK\n        string global_category\n        string name\n        text description\n        decimal price\n        decimal original_price\n        string image\n        boolean is_available\n        boolean is_recommended\n        integer estimated_time\n        json options\n        timestamp deleted_at\n        timestamp created_at\n    }\n\n    ORDERS {\n        bigint id PK\n        string order_number UK\n        string pickup_code UK\n        bigint user_id FK\n        bigint tenant_id FK\n        decimal subtotal_amount\n        decimal app_fee\n        decimal channel_fee\n        decimal total_amount\n        string payment_method\n        string payment_channel_code\n        json payment_details\n        string dining_option\n        string payment_status\n        string status\n        string snap_token\n        text notes\n        timestamp paid_at\n        timestamp processing_at\n        timestamp ready_at\n        timestamp completed_at\n        timestamp deleted_at\n        timestamp created_at\n    }\n\n    ORDER_ITEMS {\n        bigint id PK\n        bigint order_id FK\n        bigint menu_id FK\n        string menu_name\n        decimal price\n        integer quantity\n        json options\n        text note\n        decimal subtotal\n        timestamp created_at\n    }\n\n    TENANT_RATINGS {\n        bigint id PK\n        bigint tenant_id FK\n        bigint user_id FK\n        bigint order_id FK\n        integer rating\n        text comment\n        timestamp created_at\n    }\n\n    PAYMENT_METHODS {\n        bigint id PK\n        string code UK\n        string name\n        string category\n        string logo\n        string fee_type\n        decimal fee_amount\n        boolean is_active\n        timestamp created_at\n    }\n\n    APP_SETTINGS {\n        bigint id PK\n        string key UK\n        text value\n        string label\n        timestamp created_at\n    }\n```\n\n---\n\n## 2. Table Specifications\n\n### 2.1 `users`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Pengguna |\n| `name` | String | Not Null | Nama Lengkap Pengguna |\n| `email` | String | Unique, Not Null | Email Pengguna |\n| `email_verified_at` | Timestamp | Nullable | Timestamp Verifikasi Email |\n| `password` | String | Not Null | Hashed Password |\n| `tenant_id` | ForeignId | Nullable, Constrained `tenants` | Relasi ke Stand (jika role Tenant) |\n| `two_factor_secret` | Text | Nullable | Rahasia OTP 2FA |\n| `two_factor_recovery_codes` | Text | Nullable | Kode Pemulihan 2FA |\n| `two_factor_confirmed_at` | Timestamp | Nullable | Timestamp Konfirmasi 2FA |\n| `remember_token` | String | Nullable | Token Sesi Login |\n| `deleted_at` | Timestamp | Nullable | **Soft Delete** |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.2 `tenants`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Stand Kantin |\n| `name` | String | Not Null | Nama Stand / Kantin |\n| `slug` | String | Unique, Not Null | Slug URL (cth: `kantin-pak-kumis`) |\n| `description` | Text | Nullable | Deskripsi Singkat Stand |\n| `image` | String | Nullable | Foto Utama Stand |\n| `banner_image` | String | Nullable | Gambar Banner Header Stand |\n| `logo_image` | String | Nullable | Gambar Logo Stand |\n| `phone` | String | Nullable | Nomor Telepon / WA Stand |\n| `opening_hours` | String | Default `08:00 - 17:00` | Jam Operasional Stand |\n| `is_active` | Boolean | Default `true` | Status Aktif Sistem |\n| `is_open` | Boolean | Default `true` | Status Buka / Tutup Stand |\n| `rating` | Decimal(3,2) | Default `5.00` | Rata-rata Bintang Rating (1.00 - 5.00) |\n| `reviews_count` | UnsignedInt | Default `0` | Total Jumlah Ulasan Pembeli |\n| `deleted_at` | Timestamp | Nullable | **Soft Delete** |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.3 `categories`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Kategori Internal Tenant |\n| `tenant_id` | ForeignId | Constrained `tenants`, Cascade | Stand Pemilik Kategori |\n| `name` | String | Not Null | Nama Kategori (cth: *Makanan Utama*) |\n| `slug` | String | Not Null | Slug Kategori |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n*Unique Constraint*: `['tenant_id', 'slug']`\n\n---\n\n### 2.4 `menus`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Menu Makanan/Minuman |\n| `tenant_id` | ForeignId | Constrained `tenants`, Cascade | Stand Pemilik Menu |\n| `category_id` | ForeignId | Nullable, Constrained `categories` | Kategori Internal Tenant |\n| `global_category` | String | Default `makanan` | Kategori Global (`makanan`, `minuman`, `camilan`) |\n| `name` | String | Not Null | Nama Hidangan |\n| `description` | Text | Nullable | Deskripsi & Komposisi Menu |\n| `price` | Decimal(12,2) | Not Null | Harga Jual Satuan (Rp) |\n| `original_price` | Decimal(12,2) | Nullable | Harga Asli Sebelum Diskon (Rp) |\n| `image` | String | Nullable | Path Foto Menu |\n| `is_available` | Boolean | Default `true` | Status Ketersediaan Stok (*Available/Out of Stock*) |\n| `is_recommended` | Boolean | Default `false` | Tag Menu Rekomendasi / *Best Seller* |\n| `estimated_time` | Integer | Default `15` | Estimasi Waktu Penyajian (Menit) |\n| `options` | JSON | Nullable | Opsi Varian Hidangan (Toping, Level Pedas) |\n| `deleted_at` | Timestamp | Nullable | **Soft Delete** |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.5 `orders`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Transaksi Pesanan |\n| `order_number` | String | Unique, Not Null | Kode Transaksi Unik (cth: `SC-20260920-001`) |\n| `pickup_code` | String | Unique, Not Null | Kode QR / String Pengambilan (cth: `FEB-8921`) |\n| `user_id` | ForeignId | Constrained `users`, Cascade | Mahasiswa Pemesan |\n| `tenant_id` | ForeignId | Constrained `tenants`, Cascade | Stand Tujuan Pesanan |\n| `subtotal_amount` | Decimal(12,2) | Default `0.00` | Subtotal Harga Seluruh Item (Rp) |\n| `app_fee` | Decimal(12,2) | Default `0.00` | Biaya Layanan Aplikasi (Rp) |\n| `channel_fee` | Decimal(12,2) | Default `0.00` | Biaya Gateway Pembayaran (Rp) |\n| `total_amount` | Decimal(12,2) | Not Null | Total Tagihan Akhir Lunas (Rp) |\n| `payment_method` | String | Default `cashless` | Metode Utama (`cashless`, `cash`) |\n| `payment_channel_code` | String | Nullable | Kode Saluran Bayar (cth: `bca_va`, `qris`, `cash`) |\n| `payment_details` | JSON | Nullable | Simulasi Detail Pembayaran Midtrans / QR |\n| `dining_option` | String | Default `dine_in` | Opsi Santap (`dine_in`, `takeaway`) |\n| `payment_status` | String | Default `unpaid` | Status Bayar (`unpaid`, `paid`, `failed`) |\n| `status` | String | Default `pending` | Status Alur (`pending`, `paid`, `processing`, `ready`, `completed`, `failed`) |\n| `snap_token` | String | Nullable | Token Snap Midtrans |\n| `notes` | Text | Nullable | Catatan Keseluruhan Pesanan |\n| `paid_at` | Timestamp | Nullable | Timestamp Pembayaran Lunas |\n| `processing_at` | Timestamp | Nullable | Timestamp Mulai Diproses Penjual |\n| `ready_at` | Timestamp | Nullable | Timestamp Siap Di-pickup |\n| `completed_at` | Timestamp | Nullable | Timestamp Selesai Di-pickup |\n| `deleted_at` | Timestamp | Nullable | **Soft Delete** |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.6 `order_items`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Item Pesanan |\n| `order_id` | ForeignId | Constrained `orders`, Cascade | Relasi ke Order |\n| `menu_id` | ForeignId | Nullable, Set Null | Relasi ke Menu |\n| `menu_name` | String | Not Null | **Snapshot Nama Menu** |\n| `price` | Decimal(12,2) | Not Null | **Snapshot Harga Satuan** |\n| `quantity` | UnsignedInt | Not Null | Jumlah Porsi yang Dipesan |\n| `options` | JSON | Nullable | **Snapshot Opsi Varian yang Dipilih** |\n| `note` | Text | Nullable | Catatan Khusus Item Makanan |\n| `subtotal` | Decimal(12,2) | Not Null | Subtotal (`quantity` x `price`) |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.7 `tenant_ratings`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Ulasan & Rating |\n| `tenant_id` | ForeignId | Constrained `tenants`, Cascade | Stand Penerima Ulasan |\n| `user_id` | ForeignId | Constrained `users`, Cascade | Pembuat Ulasan (Mahasiswa) |\n| `order_id` | ForeignId | Nullable, Set Null | Pesanan yang Diulas |\n| `rating` | UnsignedTinyInt | Default `5` | Nilai Bintang Rating (1 - 5 ⭐) |\n| `comment` | Text | Nullable | Teks Ulasan / Kesan Pembeli |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.8 `payment_methods`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Metode Pembayaran |\n| `code` | String | Unique, Not Null | Kode Unik (cth: `bca_va`, `qris`, `cash`) |\n| `name` | String | Not Null | Nama Tampilan (cth: *BCA Virtual Account*) |\n| `category` | Enum | Default `bank_transfer` | Kategori (`bank_transfer`, `ewallet`) |\n| `logo` | String | Nullable | Path Icon / Logo Saluran |\n| `fee_type` | Enum | Default `fixed` | Tipe Biaya Penanganan (`fixed`, `percentage`) |\n| `fee_amount` | Decimal(10,2) | Default `0.00` | Besaran Biaya Admin (Rp / %) |\n| `is_active` | Boolean | Default `false` | Status Aktif Saluran Pembayaran |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n\n---\n\n### 2.9 `app_settings`\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| `id` | BigIncrements | Primary Key | ID Pengaturan Aplikasi |\n| `key` | String | Unique, Not Null | Kunci Pengaturan (cth: `app_fee`, `midtrans_sandbox`) |\n| `value` | Text | Nullable | Nilai Konfigurasi |\n| `label` | String | Nullable | Label Keterangan Pengaturan |\n| `created_at`, `updated_at` | Timestamp | Nullable | Audit Timestamps |\n", "09-payment-flow.md": "# Payment Flow & Verification — Smart Canteen FEB\n\n## 1. Dual Payment System Overview\n\nSmart Canteen FEB mendukung 2 metode pembayaran:\n1. **Cashless (Midtrans Sandbox):** Pembayaran digital otomatis dengan verifikasi HTTP callback.\n2. **Cash (Tunai):** Pembayaran tunai langsung di stand tenant menggunakan **Scan Kode QR / Input Kode Pesanan**.\n\n```mermaid\nflowchart TD\n    A[\"Checkout Mahasiswa\"] --> B{\"Pilih Metode Pembayaran\"}\n\n    B -->|\"Cashless\"| C[\"Midtrans Sandbox Snap Pop-up\"]\n    C --> D[\"Proses Pembayaran Digital\"]\n    D --> E[\"Midtrans Webhook Callback\"]\n    E --> F[\"Order Status: Dibayar\"]\n\n    B -->|\"Cash Tunai\"| G[\"Generate QR & pickup_code\"]\n    G --> H[\"Order Status: Menunggu Pembayaran Tunai\"]\n    H --> I[\"Mahasiswa Tunjukkan QR di Stand Tenant\"]\n    I --> J[\"Tenant Scan QR / Input Kode\"]\n    J --> K[\"Tenant Terima Uang & Konfirmasi\"]\n    K --> F\n```\n\n---\n\n## 2. Alur Pembayaran Cashless (Midtrans Sandbox)\n\n1. Mahasiswa mengklik \"Bayar Sekarang\" dengan opsi Cashless.\n2. Backend me-request Midtrans Snap Token via Midtrans Sandbox API.\n3. Midtrans Snap Modal muncul di layar Mahasiswa.\n4. Untuk pengujian di lingkungan **Sandbox**:\n   - **Saran Utama (BCA Virtual Account)**: [https://simulator.sandbox.midtrans.com/bca/va/index](https://simulator.sandbox.midtrans.com/bca/va/index) *(Praktis: Cukup salin Nomor VA dari Snap tanpa menyalin URL gambar QR)*.\n   - **Alternatif (QRIS)**: [https://simulator.sandbox.midtrans.com/v2/qris/index](https://simulator.sandbox.midtrans.com/v2/qris/index).\n5. Setelah transaksi dilakukan di Midtrans Simulator, Midtrans mengirimkan HTTP POST Callback Webhook ke `/api/midtrans/notification`.\n6. System mengecek signature key dan mengubah status `orders`:\n   - `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.\n\n---\n\n## 3. Alur Pembayaran Cash (Scan Kode QR oleh Tenant)\n\n1. Mahasiswa memilih opsi **Cash / Tunai**.\n2. System membuat pesanan dengan `payment_method = 'cash'`, `payment_status = 'unpaid'`, dan menghasilkan `pickup_code` unik (cth: `FEB-9912`) & QR Code string.\n3. Mahasiswa mendatangi stand tenant di kantin FEB dan menunjukkan Kode QR pada HP-nya.\n4. Tenant membuka modal **Scan / Verifikasi Pembayaran Cash** di aplikasi Tenant.\n5. Tenant melakukan scan QR via kamera atau mengetik `FEB-9912`.\n6. Aplikasi menampilkan rincian tagihan (cth: 2 Nasi Goreng + 1 Es Teh = Rp25.000).\n7. Tenant menerima uang fisik dari mahasiswa, lalu mengklik tombol **\"Konfirmasi Terima Pembayaran Tunai\"**.\n8. Backend memperbarui status pesanan: `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.\n", "10-status-order.md": "# Order Status Machine — Smart Canteen FEB\n\n## 1. State Machine Order Status\n\nStatus pesanan pada Smart Canteen FEB mengontrol alur dari awal pembuatan pesanan hingga siap diambil melalui mekanisme **Self-Pickup**.\n\n```mermaid\nstateDiagram-v2\n    [*] --> MenungguPembayaran\n\n    state MenungguPembayaran {\n        [*] --> UnpaidCashless\n        [*] --> UnpaidCash\n    }\n\n    UnpaidCashless --> Dibayar : Midtrans Callback Success\n    UnpaidCash --> Dibayar : Tenant Scan QR & Konfirmasi\n\n    state Dibayar {\n        [*] --> Paid\n    }\n\n    Dibayar --> Diproses : Tenant Klik Proses Pesanan\n\n    state Diproses {\n        [*] --> Processing\n    }\n\n    Diproses --> SiapDiambil : Tenant Klik Siap Diambil\n\n    state SiapDiambil {\n        [*] --> ReadyForPickup\n    }\n\n    SiapDiambil --> Selesai : Mahasiswa Ambil & Tenant Konfirmasi\n\n    state Selesai {\n        [*] --> Completed\n    }\n```\n\n---\n\n## 2. Status & Timestamps Audit Matrix\n\n| Status | Label UI | Trigger Cashless | Trigger Cash | Updated Timestamp |\n| :--- | :--- | :--- | :--- | :--- |\n| `pending` | **Menunggu Pembayaran** | Order Created | Order Created | `created_at` |\n| `paid` | **Dibayar** | Midtrans Webhook Callback | Tenant Scan QR & Confirm | `paid_at` |\n| `processing` | **Diproses** | Tenant Action | Tenant Action | `processing_at` |\n| `ready` | **Siap Diambil** | Tenant Action | Tenant Action | `ready_at` |\n| `completed` | **Selesai** | Tenant / Mahasiswa Action | Tenant / Mahasiswa Action | `completed_at` |\n| `failed` | **Gagal** | Midtrans Expired/Denied | Tenant Cancel | - |\n", "11-demo-scenarios.md": "# Demo Scenarios — Smart Canteen FEB\n\nDokumen ini berisi langkah-langkah pengujian (Walkthrough Test Script) untuk mendemonstrasikan sistem Smart Canteen FEB kepada penguji / stakeholder.\n\n---\n\n## 1. Demo Scenarios Flow\n\n```mermaid\nflowchart LR\n    S1[Skenario 1: Cashless Midtrans] --> S2[Skenario 2: Cash QR Scan]\n    S2 --> S3[Skenario 3: Soft Delete & Menu Kategori]\n    S3 --> S4[Skenario 4: Admin Supervision]\n```\n\n---\n\n## 2. Langkah-Langkah Skenario Demo\n\n### Skenario 1: Pemesanan Cashless (Midtrans Sandbox)\n1. Mahasiswa login (`mahasiswa@feb.ac.id`), pilih Tenant & Menu.\n2. Tambahkan ke keranjang $\\rightarrow$ Checkout $\\rightarrow$ Pilih **Cashless**.\n3. Pop-up Midtrans Sandbox akan terbuka.\n4. Selesaikan pembayaran menggunakan Midtrans Simulator:\n   - **BCA Virtual Account (Direkomendasikan)**: [https://simulator.sandbox.midtrans.com/bca/va/index](https://simulator.sandbox.midtrans.com/bca/va/index) *(Salin Nomor VA tanpa perlu simpan/salin link gambar QR)*.\n   - **QRIS Simulator**: [https://simulator.sandbox.midtrans.com/v2/qris/index](https://simulator.sandbox.midtrans.com/v2/qris/index).\n5. Status otomatis ter-update menjadi **\"Dibayar\"** dan pesanan muncul di Dashboard Tenant.\n\n### Skenario 2: Pemesanan Cash (Scan QR oleh Tenant)\n1. Mahasiswa buat pesanan baru $\\rightarrow$ Checkout $\\rightarrow$ Pilih **Cash / Tunai**.\n2. Aplikasi menampilkan **Kode QR & Pickup Code** (cth: `FEB-8821`).\n3. Pada tab Tenant (`tenant@feb.ac.id`), buka **Scan QR / Input Kode Pembayaran**.\n4. Scan / ketik `FEB-8821` $\\rightarrow$ Klik **Konfirmasi Terima Pembayaran Tunai**.\n5. Status otomatis berubah menjadi **\"Dibayar\"** $\\rightarrow$ Tenant memproses pesanan hingga **\"Siap Diambil\"** $\\rightarrow$ **\"Selesai\"**.\n\n### Skenario 3: Demonstrasi Soft Delete & Kategori Menu\n1. Tenant menambah/menghapus menu ber-kategori.\n2. Saat menu di-soft delete, riwayat pesanan lama mahasiswa **tetap aman dan konsisten** karena menggunakan snapshot & SoftDeletes.\n\n### Skenario 4: Admin Supervision\n1. Admin login (`admin@feb.ac.id`), memantau rasio pembayaran Cash vs Cashless dan kelola data master (Tenant & User dengan Soft Delete).\n", "12-technical-guidelines.md": "# Technical Guidelines — Smart Canteen FEB\n\nDokumen ini mendefinisikan arsitektur teknis, stack teknologi, konvensi kode, dan panduan pengembangan aplikasi Smart Canteen FEB.\n\n---\n\n## 1. Stack Teknologi\n\n```mermaid\nflowchart TD\n    subgraph Frontend[\"Frontend Layer (SPA)\"]\n        React[\"React 18 / TSX\"]\n        Inertia[\"Inertia.js v3\"]\n        Tailwind[\"Tailwind CSS v3\"]\n        Wayfinder[\"Laravel Wayfinder (Typed Routes)\"]\n    end\n\n    subgraph Backend[\"Backend Layer (Laravel Framework)\"]\n        PHP[\"PHP 8.4\"]\n        Laravel[\"Laravel 12 Framework\"]\n        Fortify[\"Laravel Fortify (Auth Engine)\"]\n        Spatie[\"Spatie Laravel Permission\"]\n        Midtrans[\"Midtrans PHP SDK (Sandbox)\"]\n    end\n\n    subgraph Database[\"Data Layer\"]\n        MySQL[\"SQLite / MySQL Database\"]\n    end\n\n    Frontend <-->|\"Inertia Protocol & JSON\"| Backend\n    Backend <--> Database\n    Backend <-->|\"HTTP API / Webhooks\"| Midtrans\n```\n\n---\n\n## 2. Dependensi Utama (Composer & NPM)\n\n### PHP Packages (Composer)\n* `laravel/framework`: ^12.0\n* `inertiajs/inertia-laravel`: ^2.0 / v3\n* `laravel/fortify`: Authentication backend (Login, Register, 2FA, Password Reset)\n* `spatie/laravel-permission`: ^8.3 (Manajemen Role: *Mahasiswa*, *Tenant*, *Admin*)\n* `midtrans/midtrans-php`: Integrasi SDK Pembayaran Midtrans Gateway\n* `laravel/wayfinder`: Auto-generate TypeScript/JS route actions\n\n### JS Packages (NPM)\n* `@inertiajs/react`: Interaksi Client-side React dengan Inertia\n* `react` & `react-dom`: Library UI Rendering\n* `tailwindcss`: Utility-first CSS styling\n* `lucide-react`: Icon Set Modern\n* `recharts`: Library Grafik Chart Metrik Dashboard\n\n---\n\n## 3. Struktur Direktori Utama\n\n```\nsmart_canteen/\n├── app/\n│   ├── Actions/Fortify/        # Custom Fortify Auth Actions\n│   ├── Enums/                  # PHP 8.4 Enums (UserRole, OrderStatus, etc.)\n│   ├── Http/\n│   │   ├── Controllers/\n│   │   │   ├── Admin/          # Controller Modul Admin\n│   │   │   ├── Customer/       # Controller Modul Mahasiswa\n│   │   │   ├── Tenant/         # Controller Modul Tenant\n│   │   │   └── Api/            # Webhook & API Handlers\n│   ├── Models/                 # Eloquent Models dengan SoftDeletes\n│   └── Services/               # Service Classes (MidtransService, etc.)\n├── database/\n│   ├── migrations/             # Migrasi Database\n│   └── seeders/                # Database Seeders\n├── docs/                       # Dokumentasi Teknis & Panduan Pengguna\n└── resources/\n    └── js/\n        ├── components/         # Reusable UI Components\n        ├── layouts/            # Layout Components (StudentLayout, SettingsLayout, etc.)\n        └── pages/              # Inertia React Pages\n            ├── admin/          # Dashboard & Master Data Admin\n            ├── auth/           # Login, Register, 2FA Pages\n            ├── catalog/        # Katalog Utama & Cart\n            ├── orders/         # Tracker, Payment & History\n            ├── settings/       # Profile & Security Settings\n            └── tenant/         # Dashboard & Order Board Tenant\n```\n\n---\n\n## 4. Perintah Utama Development\n\n```bash\n# Menjalankan server backend Laravel\nphp artisan serve\n\n# Menjalankan Vite dev server frontend\nnpm run dev\n\n# Format kode PHP otomatis sesuai standar Pint\nvendor/bin/pint --format agent\n\n# Regenerate Wayfinder typed routes\nphp artisan wayfinder:generate\n\n# Menjalankan seluruh pengujian Pest / PHPUnit\nphp artisan test --compact\n```\n", "13-development-rules.md": "# Development Rules\n\n## 1. Scope First\n\nSemua implementasi HARUS mengikuti dokumen di folder `docs/`.\n\nJangan menambahkan fitur baru hanya karena fitur tersebut dianggap umum,\nbagus, modern, atau dibutuhkan oleh aplikasi production.\n\nJika sebuah fitur tidak tercantum dalam scope, jangan implementasikan.\n\n## 2. Project Type\n\nProject ini adalah:\n\n- Website dummy/demo\n- Bukan production system\n- Fokus pada UI dan demo flow\n- Fokus pada alur utama Smart Canteen FEB\n\nJangan mengembangkan sistem menjadi platform production yang kompleks.\n\n## 3. Feature Addition\n\nJika requirement baru ditemukan:\n\n1. Cek apakah requirement tersebut ada di `docs/`.\n2. Jika tidak ada, jangan langsung implementasikan.\n3. Tandai sebagai OUT OF SCOPE.\n4. Minta konfirmasi sebelum mengubah scope.\n\n## 4. Avoid Overengineering\n\nJangan menambahkan:\n\n- microservices\n- queue system yang kompleks\n- event-driven architecture yang tidak diperlukan\n- caching layer yang kompleks\n- analytics\n- audit log kompleks\n- notification infrastructure\n- mobile application\n- financial accounting system\n\nkecuali secara eksplisit diminta.\n\n## 5. UI\n\nPrioritaskan:\n\n- tampilan rapi\n- responsive\n- konsisten\n- mudah digunakan\n- sesuai desain yang telah disepakati\n\nJangan membuat halaman tambahan yang tidak diperlukan hanya untuk\n\"melengkapi\" aplikasi.\n\n## 6. Payment\n\nPayment hanya digunakan untuk kebutuhan demo/alur pembayaran.\n\nJangan mengembangkan sistem payment production-grade di luar scope.", "14-out-of-scope.md": "# Out of Scope\n\nFitur berikut TIDAK termasuk dalam proyek:\n\n- Mobile application\n- Native Android/iOS application\n- Sistem keuangan\n- Laporan keuangan kompleks\n- Accounting\n- Settlement system\n- Sistem inventory kompleks\n- Integrasi POS\n- Integrasi sistem kampus\n- WhatsApp notification\n- SMS notification\n- Email notification infrastructure\n- Push notification\n- Real-time infrastructure kompleks\n- Multi-campus management\n- Loyalty program\n- Voucher system kompleks\n- Membership system\n- Advanced analytics\n- Advanced reporting\n- Production-grade payment infrastructure\n- Infrastructure scaling\n- DevOps pipeline kompleks\n- Kubernetes\n- Microservices\n- AI recommendation\n- Machine learning\n- Fitur lain yang tidak tercantum dalam scope\n\nJika fitur tersebut dibutuhkan, fitur dianggap sebagai\nCHANGE REQUEST / OUT OF SCOPE dan harus mendapat persetujuan terlebih dahulu.", "15-acceptance-criteria.md": "# Acceptance Criteria — Smart Canteen FEB\n\n## 1. Quality Gate Overview\n\n```mermaid\nflowchart TD\n    AC1[1. Dual Payment Engine: Cashless & Cash QR Scan] --> GATE{Definition of Done}\n    AC2[2. Soft Deletes Data Integrity pada User, Tenant, Menu, Order] --> GATE\n    AC3[3. Kategori Global/Internal & Snapshot Order Items] --> GATE\n    AC4[4. Self-Pickup Live Tracker 5-Tahap & Timestamps Audit] --> GATE\n    AC5[5. Admin & Tenant Dashboard Supervision Metrics] --> GATE\n    AC6[6. Rating & Ulasan Mahasiswa + Custom Menu Notes] --> GATE\n    GATE -- Pass All --> PASSED[PROYEK DEMO ACC / SELESAI]\n```\n\n---\n\n## 2. Checklist Acceptance Criteria\n\n* [x] Mahasiswa dapat melakukan checkout dengan metode pembayaran **Cashless** (Midtrans Sandbox via BCA VA/QRIS) maupun **Cash** (Tunai di Stand).\n* [x] Mahasiswa menerima Kode QR & string `pickup_code` unik (format `FEB-XXXX`) untuk transaksi pembayaran tunai & self-pickup.\n* [x] Tenant memiliki fitur **Scan Kode QR Kamera / Input Kode Manual** pada `/tenant/verify-payment` untuk mengonfirmasi pembayaran tunai.\n* [x] Model `User`, `Tenant`, `Menu`, dan `Order` mengimplementasikan Trait `SoftDeletes` (`deleted_at`) sehingga riwayat transaksi historis tetap utuh 100%.\n* [x] Model `OrderItem` menyimpan `menu_name`, `price`, `options`, dan `note` sebagai snapshot data saat transaksi dibuat.\n* [x] Tenant dapat mengelompokkan menu berdasarkan `Category` internal stand, dan menu terhubung dengan `global_category` (*makanan, minuman, camilan*).\n* [x] Status pesanan meng-update timestamp audit secara otomatis (`paid_at`, `processing_at`, `ready_at`, `completed_at`).\n* [x] Tenant dapat mengoperasikan saklar *Status Buka/Tutup Stand* (`is_open`) dan saklar *Stok Instant* (*Available/Out of Stock*).\n* [x] Mahasiswa dapat memberikan rating bintang 1–5 ⭐ dan ulasan teks setelah pesanan di-pickup.\n* [x] Admin dapat memantau statistik total omset kantin, mengelola master tenant & user, serta mengatur biaya layanan aplikasi (*Admin Fee*).\n", "16-rab.md": "# Rencana Anggaran Biaya (RAB) — Smart Canteen FEB\n\nDokumen ini merincikan alokasi anggaran biaya (Rp1.000.000) dan estimasi pengerjaan (5–7 Hari Kerja) untuk pengembangan Website Demo Smart Canteen FEB.\n\n---\n\n## 1. Timeline & Budget Breakdown\n\n```mermaid\n%%{init: { \"gantt\": { \"leftPadding\": 160, \"useWidth\": 900 } } }%%\ngantt\n    title Timeline Pengerjaan Smart Canteen FEB (5-7 Hari)\n    dateFormat  YYYY-MM-DD\n    axisFormat  %d %b\n    tickInterval 1day\n    section Phase 1: Planning & Setup\n    Doc & DB Schema with SoftDeletes  :active, p1, 2026-09-18, 1d\n    section Phase 2: Core & Dual Payment\n    Auth & Category Menu Setup        :p2, after p1, 1d\n    Cart & Checkout (Cash vs Cashless):p3, after p2, 1d\n    Midtrans Sandbox & Cash QR Scan   :p4, after p3, 2d\n    section Phase 3: Tenant & Admin\n    Tenant QR Scanner & Order Board   :p5, after p4, 1d\n    Admin Dashboard & Final Polish    :p6, after p5, 1d\n```\n\n---\n\n## 2. Rincian Alokasi Biaya (Rp1.000.000)\n\n| No | Modul / Komponen Pekerjaan | Bobot (%) | Biaya (IDR) | Output / Deliverables |\n| :--- | :--- | :---: | :---: | :--- |\n| 1 | **Setup Architecture, DB Schema & SoftDeletes** | 15% | Rp150.000 | Core setup Laravel 12 + Inertia React, Spatie Roles, Migration with SoftDeletes & Categories. |\n| 2 | **Modul Mahasiswa (Katalog Kategori & Checkout)** | 25% | Rp250.000 | Katalog Menu per Kategori, Cart, Checkout pilihan Cashless / Cash, Digital QR Code display. |\n| 3 | **Dual Payment Engine (Midtrans & Cash QR Scan)**| 25% | Rp250.000 | Midtrans Sandbox integration + Tenant QR Code Scanner / Input Code Verifier for Cash payment. |\n| 4 | **Modul Tenant (Order Board & Menu CRUD)** | 20% | Rp200.000 | Tenant Order Status Board (`Dibayar` $\\rightarrow$ `Diproses` $\\rightarrow$ `Siap Diambil`), Category & Menu CRUD (Soft Delete). |\n| 5 | **Modul Admin & Final Polish** | 15% | Rp150.000 | Admin Supervision Dashboard, Master Data Management, Responsive Mobile & Desktop polish. |\n| **TOTAL** | | **100%** | **Rp1.000.000** | **Website Demo Ready Smart Canteen FEB** |\n", "08-data-model-full.md": "# Data Model & Skema Database Lengkap (Seluruh Tabel Migrasi) — Smart Canteen FEB\n\nDokumen ini mendefinisikan **seluruh skema basis data secara komprehensif (22 tabel)** yang dihasilkan dari seluruh berkas migrasi database pada sistem **Smart Canteen FEB**, mencakup:\n1. **Entitas Domain Bisnis (10 Tabel)**: `users`, `tenants`, `categories`, `menus`, `orders`, `order_items`, `tenant_ratings`, `favorites`, `payment_methods`, `app_settings`\n2. **Sistem Akses & Peran Spatie RBAC (5 Tabel)**: `roles`, `permissions`, `model_has_roles`, `model_has_permissions`, `role_has_permissions`\n3. **Infrastruktur Autentikasi & Sesi Laravel (2 Tabel)**: `password_reset_tokens`, `sessions`\n4. **Infrastruktur Asynchronous Queue & Background Jobs (3 Tabel)**: `jobs`, `job_batches`, `failed_jobs`\n5. **Infrastruktur Cache & Distributed Locking (2 Tabel)**: `cache`, `cache_locks`\n\n---\n\n## 1. Daftar & Taksonomi Tabel Migrasi\n\nBerikut adalah pemetaan seluruh 22 tabel basis data yang didefinisikan dalam migrasi Laravel:\n\n| No | Nama Tabel | Kategori Modul | File Sumber Migrasi | Keterangan Singkat |\n| :-: | :--- | :--- | :--- | :--- |\n| 1 | `users` | Domain / Auth | `0001_01_01_000000`, `2025_08_14_170933`, `2026_09_19_072844` | Pengguna sistem (Mahasiswa, Tenant, Admin), 2FA, dan Soft Deletes |\n| 2 | `tenants` | Domain Bisnis | `2026_09_19_072843`, `2026_09_20_030000` | Profil stand/kantin, jam buka, rating akumulatif, Soft Deletes |\n| 3 | `categories` | Domain Bisnis | `2026_09_19_072845` | Kategori menu internal per stand tenant |\n| 4 | `menus` | Domain Bisnis | `2026_09_19_072846`, `2026_09_19_182534`, `2026_09_20_040000` | Menu hidangan, kategori global, varian JSON, promo, Soft Deletes |\n| 5 | `orders` | Domain Bisnis | `2026_09_19_072847`, `2026_09_20_070000`, `2026_09_20_080000` | Transaksi pesanan, breakdown biaya, kode QR, token Snap, status alur |\n| 6 | `order_items` | Domain Bisnis | `2026_09_19_072848`, `2026_09_20_070000` | Rincian item pesanan, snapshot nama & harga menu, varian JSON |\n| 7 | `tenant_ratings` | Domain Bisnis | `2026_09_20_030001` | Ulasan & penilaian bintang (1-5) dari mahasiswa kepada tenant |\n| 8 | `favorites` | Domain Bisnis | `2026_09_21_140000` | Daftar menu favorit (bookmark) per pengguna |\n| 9 | `payment_methods`| Domain Bisnis | `2026_09_20_060000` | Master data opsi pembayaran (bank transfer, e-wallet, admin fee) |\n| 10 | `app_settings` | Domain Bisnis | `2026_09_20_060001` | Konfigurasi parameter global aplikasi & biaya layanan |\n| 11 | `roles` | Spatie RBAC | `2026_09_18_131157` | Definisi peran otoritas (`student`, `tenant`, `admin`) |\n| 12 | `permissions` | Spatie RBAC | `2026_09_18_131157` | Definisi hak akses spesifik per guard |\n| 13 | `model_has_roles`| Spatie RBAC | `2026_09_18_131157` | Pivot polimorfik relasi user/model dengan peran (roles) |\n| 14 | `model_has_permissions` | Spatie RBAC | `2026_09_18_131157` | Pivot polimorfik relasi user/model dengan hak akses langsung |\n| 15 | `role_has_permissions` | Spatie RBAC | `2026_09_18_131157` | Pivot relasi many-to-many hak akses yang melekat pada peran |\n| 16 | `password_reset_tokens` | Laravel Core | `0001_01_01_000000` | Penyimpanan token permintaan lupa/reset kata sandi |\n| 17 | `sessions` | Laravel Core | `0001_01_01_000000` | Session driver database untuk melacak aktivitas login & IP |\n| 18 | `jobs` | Laravel Queue | `0001_01_01_000002` | Antrean eksekusi background tasks (notifikasi, webhook) |\n| 19 | `job_batches` | Laravel Queue | `0001_01_01_000002` | Pelacakan pemrosesan batch antrean pekerjaan |\n| 20 | `failed_jobs` | Laravel Queue | `0001_01_01_000002` | Log pengecualian dan payload tugas antrean yang gagal |\n| 21 | `cache` | Laravel Cache | `0001_01_01_000001` | Cache driver database untuk performa query berulang |\n| 22 | `cache_locks` | Laravel Cache | `0001_01_01_000001` | Mekanisme atomic locks untuk mencegah race conditions |\n\n---\n\n## 2. Entity Relationship Diagram (ERD) Lengkap & Rapat\n\nAgar diagram tetap **rapat, proporsional, dan mudah dibaca**, entitas ditampilkan secara ringkas berbasis **Key Columns (PK, FK, UK, dan Kolom Status/Identitas Utama)** tanpa membebani visual dengan audit timestamps (spesifikasi kolom 100% lengkap tersedia di Bab 3).\n\n### 2.1 ERD Terpadu: Domain Bisnis, Autentikasi & Spatie RBAC (17 Tabel)\n\nDiagram di bawah ini merangkum seluruh tabel domain yang saling berelasi aktif secara terpadu dan rapat:\n\n```mermaid\nerDiagram\n    %% Hubungan Modul Pengguna, Auth & Sesi\n    USERS ||--o{ ORDERS : \"places\"\n    USERS ||--o{ FAVORITES : \"bookmarks\"\n    USERS ||--o{ TENANT_RATINGS : \"reviews\"\n    USERS ||--o{ SESSIONS : \"sessions\"\n    USERS ||--o{ PASSWORD_RESET_TOKENS : \"resets\"\n    USERS |o--o| TENANTS : \"manages\"\n\n    %% Hubungan Modul Katalog & Transaksi Stand\n    TENANTS ||--o{ MENUS : \"sells\"\n    TENANTS ||--o{ CATEGORIES : \"groups\"\n    TENANTS ||--o{ ORDERS : \"receives\"\n    TENANTS ||--o{ TENANT_RATINGS : \"rated\"\n    CATEGORIES ||--o{ MENUS : \"classifies\"\n    MENUS ||--o{ ORDER_ITEMS : \"ordered\"\n    MENUS ||--o{ FAVORITES : \"fav\"\n    ORDERS ||--|{ ORDER_ITEMS : \"contains\"\n    ORDERS ||--o{ TENANT_RATINGS : \"rated_in\"\n    PAYMENT_METHODS ||--o{ ORDERS : \"channels\"\n\n    %% Hubungan Spatie RBAC (Polimorfik & Pivot)\n    ROLES ||--o{ ROLE_HAS_PERMISSIONS : \"grants\"\n    PERMISSIONS ||--o{ ROLE_HAS_PERMISSIONS : \"assigned\"\n    ROLES ||--o{ MODEL_HAS_ROLES : \"assigned_to\"\n    PERMISSIONS ||--o{ MODEL_HAS_PERMISSIONS : \"assigned_to\"\n    USERS ||--o{ MODEL_HAS_ROLES : \"has_roles\"\n    USERS ||--o{ MODEL_HAS_PERMISSIONS : \"has_perms\"\n\n    %% Entitas Inti (Definisi Atribut Kunci Ringkas & Rapat)\n    USERS {\n        bigint id PK\n        string name\n        string email UK\n        bigint tenant_id FK\n        timestamp deleted_at\n    }\n\n    TENANTS {\n        bigint id PK\n        string name\n        string slug UK\n        boolean is_open\n        decimal rating\n        timestamp deleted_at\n    }\n\n    CATEGORIES {\n        bigint id PK\n        bigint tenant_id FK\n        string name\n        string slug\n    }\n\n    MENUS {\n        bigint id PK\n        bigint tenant_id FK\n        bigint category_id FK\n        string global_category\n        string name\n        decimal price\n        boolean is_available\n        timestamp deleted_at\n    }\n\n    ORDERS {\n        bigint id PK\n        string order_number UK\n        string pickup_code UK\n        bigint user_id FK\n        bigint tenant_id FK\n        decimal total_amount\n        string payment_method\n        string payment_status\n        string status\n        timestamp deleted_at\n    }\n\n    ORDER_ITEMS {\n        bigint id PK\n        bigint order_id FK\n        bigint menu_id FK\n        string menu_name\n        decimal price\n        int quantity\n        decimal subtotal\n    }\n\n    TENANT_RATINGS {\n        bigint id PK\n        bigint tenant_id FK\n        bigint user_id FK\n        bigint order_id FK\n        tinyint rating\n    }\n\n    FAVORITES {\n        bigint id PK\n        bigint user_id FK\n        bigint menu_id FK\n    }\n\n    PAYMENT_METHODS {\n        bigint id PK\n        string code UK\n        string name\n        string category\n        decimal fee_amount\n        boolean is_active\n    }\n\n    APP_SETTINGS {\n        bigint id PK\n        string key UK\n        text value\n    }\n\n    ROLES {\n        bigint id PK\n        string name UK\n        string guard_name\n    }\n\n    PERMISSIONS {\n        bigint id PK\n        string name UK\n        string guard_name\n    }\n\n    MODEL_HAS_ROLES {\n        bigint role_id PK,FK\n        string model_type PK\n        bigint model_id PK\n    }\n\n    MODEL_HAS_PERMISSIONS {\n        bigint permission_id PK,FK\n        string model_type PK\n        bigint model_id PK\n    }\n\n    ROLE_HAS_PERMISSIONS {\n        bigint permission_id PK,FK\n        bigint role_id PK,FK\n    }\n\n    SESSIONS {\n        string id PK\n        bigint user_id FK\n        string ip_address\n        int last_activity\n    }\n\n    PASSWORD_RESET_TOKENS {\n        string email PK\n        string token\n    }\n```\n\n---\n\n### 2.2 ERD Infrastruktur: Background Jobs & Cache Engine (5 Tabel)\n\nDiagram terpisah untuk tabel-tabel infrastruktur asinkron dan caching agar visualisasi tetap rapat dan tidak mengaburkan model relasional bisnis:\n\n```mermaid\nerDiagram\n    %% Relasi Logis Antrean Job & Batch\n    JOB_BATCHES ||--o{ JOBS : \"tracks_batches\"\n    JOBS ||--o{ FAILED_JOBS : \"failed_transitions\"\n    CACHE ||--o{ CACHE_LOCKS : \"synchronizes\"\n\n    JOBS {\n        bigint id PK\n        string queue\n        smallint attempts\n        int available_at\n        int created_at\n    }\n\n    JOB_BATCHES {\n        string id PK\n        string name\n        int total_jobs\n        int pending_jobs\n        int failed_jobs\n    }\n\n    FAILED_JOBS {\n        bigint id PK\n        string uuid UK\n        string connection\n        string queue\n        timestamp failed_at\n    }\n\n    CACHE {\n        string key PK\n        bigint expiration\n    }\n\n    CACHE_LOCKS {\n        string key PK\n        string owner\n        bigint expiration\n    }\n```\n\n---\n\n## 3. Spesifikasi Detail Seluruh 22 Tabel\n\n### 3.1 Modul Domain & Bisnis\n\n#### 1. `users`\n*Tabel utama akun pengguna sistem (Mahasiswa, Pemilik Tenant, Admin) beserta proteksi 2FA dan Soft Deletes.*\n* **Migrasi**: `0001_01_01_000000_create_users_table.php`, `2025_08_14_170933_add_two_factor_columns_to_users_table.php`, `2026_09_19_072844_add_tenant_and_soft_deletes_to_users_table.php`\n\n| Nama Kolom | Tipe Data | Nullable | Default | Keterangan & Batasan |\n| :--- | :--- | :---: | :---: | :--- |\n| `id` | `BIGINT UNSIGNED` | ❌ | *Auto-inc* | **PRIMARY KEY** |\n| `name` | `VARCHAR(255)` | ❌ | - | Nama lengkap pengguna |\n| `email` | `VARCHAR(255)` | ❌ | - | **UNIQUE**, alamat email untuk login |\n| `email_verified_at` | `TIMESTAMP` | ✔️ | `NULL` | Waktu verifikasi email |\n| `password` | `VARCHAR(255)` | ❌ | - | Hash kata sandi pengguna (Bcrypt / Argon2) |\n| `tenant_id` | `BIGINT UNSIGNED` | ✔️ | `NULL` | **FOREIGN KEY** `tenants(id)` `ON DELETE SET NULL`. Relasi jika pengguna adalah pemilik stand |\n| `two_factor_secret` | `TEXT` | ✔️ | `NULL` | Secret key terenkripsi untuk Google Authenticator / TOTP |\n| `two_factor_recovery_codes` | `TEXT` | ✔️ | `NULL` | Kumpulan kode pemulihan darurat 2FA |\n| `two_factor_confirmed_at` | `TIMESTAMP` | ✔️ | `NULL` | Waktu konfirmasi aktivasi 2FA |\n| `remember_token` | `VARCHAR(100)` | ✔️ | `NULL` | Token sesi login otomatis (*Remember Me*) |\n| `deleted_at` | `TIMESTAMP` | ✔️ | `NULL` | Timestamp **Soft Delete** (menjaga riwayat pesanan historis) |\n| `created_at` | `TIMESTAMP` | ✔️ | `NULL` | Waktu pembuatan akun |\n| `updated_at` | `TIMESTAMP` | ✔️ | `NULL` | Waktu pembaruan data akun |\n\n---\n\n#### 2. `tenants`\n*Menyimpan entitas profil stand/warung kantin di FEB.*\n* **Migrasi**: `20
