## 1. Informasi Proyek

**Nama Proyek:** Smart Canteen FEB
**Jenis:** Website Dummy / Demo
**Budget:** Rp1.000.000
**Estimasi Pengerjaan:** 5–7 hari kerja

Dokumen ini menjadi **batas utama pengembangan proyek**.

Seluruh implementasi harus mengikuti scope yang tercantum di dokumen ini.

---

## 2. Tujuan Proyek

Smart Canteen FEB adalah website demo yang digunakan untuk memperlihatkan konsep pemesanan makanan/minuman di lingkungan FEB dengan dukungan opsi pembayaran **Cashless (Midtrans Sandbox)** dan **Cash (Tunai dengan Scan QR/Kode oleh Tenant)**, penataan menu ber-kategori, serta keamanan data historis melalui **Soft Deletes**.

Tujuan utama website:

* Menampilkan tenant/kantin.
* Menampilkan menu ber-kategori yang tersedia.
* Memungkinkan mahasiswa membuat pesanan.
* Menampilkan proses checkout (Pilihan **Cashless** vs **Cash**).
* Menampilkan simulasi/alur pembayaran Cashless (Midtrans Sandbox) dan Cash (Scan Kode oleh Tenant).
* Memungkinkan tenant memproses pesanan.
* Menampilkan status pesanan sampai siap diambil.
* Menunjukkan konsep **Self-pickup**.
* Menerapkan **Soft Deletes** pada entity krusial (Users, Tenants, Menus, Orders) untuk integritas riwayat transaksi.

Website ini **BUKAN sistem kantin production**.

Fokus utama adalah **UI, UX, dan demonstrasi alur bisnis utama**.

---

## 3. Aktor Sistem

Sistem hanya memiliki tiga jenis pengguna:

### 3.1 Mahasiswa

Mahasiswa dapat:

* Login / mengakses akun.
* Melihat daftar tenant.
* Melihat menu tenant berdasarkan kategori.
* Melihat detail menu.
* Menambahkan menu ke keranjang.
* Mengubah isi keranjang.
* Melakukan checkout (Pilih **Cashless** atau **Cash**).
* Mendapatkan Kode QR / Kode Pengambilan pesanan.
* Melakukan simulasi pembayaran Cashless atau menampilkan Kode ke Tenant untuk bayar Cash.
* Melihat status pesanan dan tracker timeline.
* Melihat riwayat pesanan.
* Melihat informasi pengambilan pesanan (**Self-Pickup**).

### 3.2 Tenant / Penjual

Tenant dapat:

* Login ke dashboard.
* Melihat pesanan masuk.
* Menampilkan scanner / input kode pesanan untuk **Konfirmasi Pembayaran Cash**.
* Melihat detail pesanan.
* Mengubah status pesanan (`Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).
* Mengelola kategori menu.
* Menambahkan, mengubah, menghapus menu (dengan **Soft Deletes**).
* Mengatur ketersediaan menu (Toggle Stock).

### 3.3 Admin

Admin dapat:

* Login ke dashboard admin.
* Melihat statistik demo.
* Mengelola data tenant (Tambah, Edit, Hapus via **Soft Deletes**).
* Mengelola pengguna & role (Mahasiswa, Tenant, Admin dengan **Soft Deletes**).
* Melihat & memantau seluruh transaksi kantin.

---

## 4. Scope Pembayaran & Verifikasi

### 4.1 Cashless (Midtrans Sandbox)
```mermaid
flowchart TD
    Checkout[\"Mahasiswa Checkout Cashless\"] --> Snap[\"Tampil Pop-up Midtrans Sandbox\"]
    Snap --> Simulator[\"Bayar via Midtrans Simulator\"]
    Simulator --> Webhook[\"Callback Webhook Midtrans\"]
    Webhook --> Paid[\"Status: Dibayar\"]
    Paid --> TenantDashboard[\"Tampil di Tenant Dashboard\"]
```

### 4.2 Cash (Tunai di Stand Tenant)
```mermaid
flowchart TD
    Checkout[\"Mahasiswa Checkout Cash\"] --> GenCode[\"Generate QR / Kode Pengambilan\"]
    GenCode --> Pending[\"Status: Menunggu Pembayaran Tunai\"]
    Pending --> Stand[\"Mahasiswa Datang ke Stand Tenant\"]
    Stand --> Scan[\"Tenant Scan QR / Input Kode di App Tenant\"]
    Scan --> Confirm[\"Tenant Terima Uang & Klik Konfirmasi\"]
    Confirm --> Paid[\"Status: Dibayar\"]
    Paid --> Process[\"Tenant Memproses Pesanan\"]
```

---

## 5. Scope Data & Soft Deletes

Data krusial menggunakan fitur **Soft Deletes (`deleted_at`)**:
1. `users`: Jika akun dinonaktifkan/dihapus, riwayat transaksi pesanan historis tetap utuh.
2. `tenants`: Jika tenant tutup/dihapus, riwayat belanja mahasiswa tidak hilang.
3. `menus`: Jika menu dihapus dari katalog tenant, pesanan lama tetap menampilkan nama dan harga menu tersebut (Snapshot Data).
4. `orders`: Pesanan yang dibatalkan/dihapus tetap tersimpan secara soft delete untuk transparansi demo.

---

## 6. Alur Bisnis Utama

Alur utama yang **WAJIB dapat didemokan**:

```mermaid
sequenceDiagram
    autonumber
    actor M as Mahasiswa
    participant SYS as \"Sistem Smart Canteen\"
    participant MID as \"Midtrans Sandbox\"
    actor T as Tenant

    M->>SYS: Login dan Pilih Tenant / Menu
    M->>SYS: Checkout (Pilih Cashless / Cash)
    alt Metode Cashless
        SYS->>MID: Request Snap Token
        MID-->>M: Tampilkan Midtrans Pop-up Sandbox
        M->>MID: Selesaikan Bayar di Sandbox
        MID-->>SYS: Callback Auto Webhook
        SYS->>SYS: Update Status: Dibayar
    else Metode Cash (Tunai)
        SYS-->>M: Generate Kode QR / Pengambilan
        M->>T: Tunjukkan Kode QR dan Uang Tunai di Stand
        T->>SYS: Scan QR / Input Kode Pesanan -> Konfirmasi Bayar
        SYS->>SYS: Update Status: Dibayar
    end
    SYS-->>T: Pesanan Masuk di Dashboard
    T->>SYS: Update Status: Diproses
    T->>SYS: Update Status: Siap Diambil
    M->>T: Datang Ambil Pesanan (Self-Pickup)
    T->>SYS: Update Status: Selesai
```

---

## 7. Definition of Done

Proyek dianggap memenuhi scope apabila:
* Mahasiswa dapat memesan dengan opsi **Cashless** (Midtrans Sandbox) maupun **Cash** (Scan QR oleh Tenant).
* Tenant dapat melakukan **Scan Kode QR / Input Kode** untuk menerima bayar tunai.
* Data `users`, `tenants`, `menus`, dan `orders` menerapkan **Soft Deletes**.
* Menu terkelola dalam **Kategori Menu**.
* Core flow dapat didemonstrasikan dari awal sampai selesai tanpa error.

## 1. Requirements Overview

Dokumen ini mendefinisikan kebutuhan fungsional (Functional Requirements) dan non-fungsional (Non-Functional Requirements) dari sistem Smart Canteen FEB berdasarkan [01-scope.md](file:///home/darbi/Projects/smart_canteen/docs/01-scope.md).

## 2. Functional Requirements (FR)

### 2.1 Modul Mahasiswa (Customer)
* **FR-MHS-01:** Mahasiswa dapat melakukan login dan logout.
* **FR-MHS-02:** Mahasiswa dapat melihat daftar tenant dan filter menu berdasarkan kategori (Makanan, Minuman, Camilan).
* **FR-MHS-03:** Mahasiswa dapat melihat detail menu (nama, harga, foto, ketersediaan).
* **FR-MHS-04:** Mahasiswa dapat mengelola keranjang belanja (cart).
* **FR-MHS-05:** Mahasiswa dapat memilih metode pembayaran di Checkout: **Cashless** (Midtrans Sandbox) atau **Cash** (Tunai di Stand).
* **FR-MHS-06:** Mahasiswa mendapatkan **Kode QR / Kode Pengambilan** unik untuk setiap transaksi.
* **FR-MHS-07:** Mahasiswa dapat memantau live status pesanan (`Menunggu Pembayaran` → `Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).
* **FR-MHS-08:** Mahasiswa dapat melihat riwayat pesanan (historis tetap aman meskipun menu/tenant di-soft delete).

### 2.2 Modul Tenant (Penjual)
* **FR-TNT-01:** Tenant dapat login ke dashboard tenant.
* **FR-TNT-02:** Tenant dapat melakukan **Scan Kode QR / Input Kode Pesanan** mahasiswa untuk mengonfirmasi pembayaran Tunai (Cash).
* **FR-TNT-03:** Tenant dapat melihat ringkasan & detail pesanan masuk.
* **FR-TNT-04:** Tenant dapat memperbarui status pesanan (`Dibayar` → `Diproses` → `Siap Diambil` → `Selesai`).
* **FR-TNT-05:** Tenant dapat mengelola Kategori Menu & Item Menu (Tambah, Edit, Soft Delete, Toggle Stok Available/Out of Stock).

### 2.3 Modul Admin (Pengelola)
* **FR-ADM-01:** Admin dapat login ke dashboard admin.
* **FR-ADM-02:** Admin dapat melihat statistik demo (Total Tenant, Total User, Total Transaksi, Transaksi Cash vs Cashless).
* **FR-ADM-03:** Admin dapat mengelola data tenant (CRUD + Soft Delete).
* **FR-ADM-04:** Admin dapat mengelola pengguna & role (CRUD + Soft Delete).
* **FR-ADM-05:** Admin dapat memantau seluruh transaksi kantin secara global.

---

## 3. Non-Functional Requirements (NFR)

### 3.1 Data Integrity & Soft Deletes
* **NFR-01:** Menerapkan `softDeletes` (`deleted_at`) pada `users`, `tenants`, `menus`, dan `orders` untuk menjaga integritas data historis.
* **NFR-02:** Menggunakan snapshot nama & harga menu pada `order_items` saat transaksi terjadi.

### 3.2 Performance & Usability
* **NFR-03:** Layout responsive (Mobile-first untuk Mahasiswa, Desktop/Mobile friendly untuk Tenant & Admin).
* **NFR-04:** Respon verifikasi scan QR / kode tunai di stand tenant berjalan instan (< 1 detik).
", "03-user-flow.md": "# User Flow — Smart Canteen FEB

## 1. Core End-to-End Business Flow

Alur utama pemesanan dengan opsi **Cashless (Midtrans Sandbox)** dan **Cash (Scan QR / Kode di Tenant)** disajikan dalam diagram Mermaid berikut:

```mermaid
sequenceDiagram
    autonumber
    actor M as Mahasiswa
    participant SYS as \"Sistem Smart Canteen\"
    participant MID as \"Midtrans Sandbox\"
    actor T as Tenant

    M->>SYS: Login dan Lihat Menu per Kategori
    M->>SYS: Tambah ke Keranjang lalu Checkout
    M->>SYS: Pilih Metode Pembayaran (Cashless / Cash)
    
    alt Pembayaran Cashless
        SYS->>MID: Request Midtrans Snap Token
        MID-->>M: Tampilkan Midtrans Sandbox Pop-up
        M->>MID: Selesaikan Bayar di Sandbox
        MID-->>SYS: Webhook Auto Callback Success
        SYS->>SYS: Status Pesanan: Dibayar
    else Pembayaran Cash (Tunai)
        SYS-->>M: Tampilkan Kode QR / Kode Pengambilan
        M->>T: Tunjukkan Kode QR dan Serahkan Uang Tunai di Stand
        T->>SYS: Scan QR / Input Kode di App Tenant
        T->>SYS: Klik Konfirmasi Terima Tunai
        SYS->>SYS: Status Pesanan: Dibayar
    end

    SYS-->>T: Pesanan Masuk di Dashboard Tenant
    T->>SYS: Ubah Status: Diproses
    T->>SYS: Ubah Status: Siap Diambil
    SYS-->>M: Live Tracker Update: Siap Diambil
    M->>T: Ambil Makanan di Stand (Self-Pickup)
    T->>SYS: Konfirmasi Selesai: Status Selesai
```

---

## 2. Detail Alur Pembayaran Cash (Scan QR oleh Tenant)

```mermaid
flowchart TD
    A[\"Mahasiswa Checkout Pilih Cash\"] --> B[\"Sistem Generate pickup_code & QR\"]
    B --> C[\"Status Order: Menunggu Pembayaran Tunai\"]
    C --> D[\"Mahasiswa Datang ke Stand Tenant\"]
    D --> E[\"Tenant Buka Scanner / Input Form di App Tenant\"]
    E --> F[\"Tenant Scan QR / Ketik Kode Pesanan\"]
    F --> G[\"Tampil Detail Tagihan & Item Pesanan\"]
    G --> H[\"Tenant Terima Uang & Klik Konfirmasi Pembayaran\"]
    H --> I[\"Status Order Berubah: Dibayar\"]
    I --> J[\"Tenant Langsung Memproses Pesanan\"]
```
", "04-user-roles.md": "# User Roles & Permissions — Smart Canteen FEB

## 1. Definisi Role

Sistem Smart Canteen FEB menggunakan 3 role utama via **Spatie Laravel Permission**:

1. `mahasiswa` (Customer)
2. `tenant` (Penjual / Stand FEB)
3. `admin` (Pengelola System)

---

## 2. Hak Akses & Matriks Permisi

| Fitur / Halaman | Mahasiswa | Tenant | Admin |
| :--- | :---: | :---: | :---: |
| **Login / Logout** | ✅ | ✅ | ✅ |
| **Melihat Tenant & Menu per Kategori** | ✅ | ✅ | ✅ |
| **Tambah ke Cart & Checkout (Cashless / Cash)** | ✅ | ❌ | ❌ |
| **Mendapatkan Kode QR / Kode Pengambilan** | ✅ | ❌ | ❌ |
| **Scan QR / Input Kode Pembayaran Cash** | ❌ | ✅ | ❌ |
| **Kelola Status Pesanan (`Dibayar` → `Selesai`)** | ❌ | ✅ | ❌ |
| **Kelola Kategori & Menu (CRUD + Soft Delete)** | ❌ | ✅ | ❌ |
| **Dashboard Admin & Supervision** | ❌ | ❌ | ✅ |
| **Kelola Tenant (CRUD + Soft Delete)** | ❌ | ❌ | ✅ |
| **Kelola User (CRUD + Soft Delete)** | ❌ | ❌ | ✅ |

---

## 3. Aturan Soft Delete Permisi
* Tenant atau Admin yang melakukan penghapusan data (User, Tenant, Menu) hanya melakukan Soft Delete (`deleted_at`), sehingga tidak menghapus data secara permanen dan menjaga integritas tabel transaksi `orders` & `order_items`.

## 1. Modul Mahasiswa (Customer)

* **F-MHS-08 Dual Payment Engine:**
  - **Cashless Digital (Midtrans Sandbox):** Integrasi Snap Pop-up dengan simulasi BCA Virtual Account ([Simulator BCA VA](https://simulator.sandbox.midtrans.com/bca/va/index)) dan QRIS ([Simulator QRIS](https://simulator.sandbox.midtrans.com/v2/qris/index)).
  - **Tunai / Cash:** Digital Pickup Pass dengan gambar Kode QR, string unik `FEB-XXXX`, dan hitung mundur timer bayar 15 menit.

* **F-MHS-10 Rating & Ulasan Menu:** Pemberian bintang 1–5 ⭐ dan ulasan rasa/pelayanan setelah pesanan di-pickup (`/orders/{order}/rate`).

## 2. Modul Tenant (Pemilik Stand)

### 2.2 Order Board & Verifikasi QR Tunai
* **F-TNT-04 Kitchen Order Board & Kanban:** Papan kontrol pesanan masuk (`/tenant/orders`) berbasis tab status dengan aksi update cepat (`🍳 Mulai Proses` ➔ `🔔 Siap Diambil` ➔ `✅ Tandai Selesai`).
* **F-TNT-05 Cash QR Code Scanner & Code Verifier:** Fitur kamera scan QR Code / input manual kode `FEB-XXXX` di kasir stand (`/tenant/verify-payment`) untuk memverifikasi pembayaran tunai.

### 2.3 Manajemen Kategori, Menu & Ulasan
* **F-TNT-06 Manajemen Kategori Menu:** CRUD pengelompokan menu internal stand (`/tenant/categories`).
* **F-TNT-07 Manajemen Katalog Menu (CRUD + Soft Delete):** Menambah, mengubah foto, harga, estimasi waktu penyajian, varian opsi, tag *Best Seller*, dan saklar stok instant (*Available / Out of Stock*) (`/tenant/menus`).
* **F-TNT-08 Fitur Sampah (Restore Data):** Pemulihan data menu yang tidak sengaja terhapus via fitur Soft Delete.
* **F-TNT-09 Ulasan & Rating Pembeli:** Melihat daftar ulasan bintang dan testimoni pembeli (`/tenant/ratings`).

---

## 3. Modul Admin (Administrator System)

### 3.1 Pengawasan Global & Metric
* **F-ADM-01 Admin Dashboard Supervision:** Monitoring total omset kantin FEB, jumlah stand aktif, total user, rasio metode pembayaran, dan statistik transaksi (`/admin/dashboard`).
* **F-ADM-02 Global Order Supervision:** Monitoring seluruh transaksi kantin secara global dengan filter tanggal, stand, dan status (`/admin/orders`).

### 3.2 Master Data & Settings
* **F-ADM-03 Master Data Tenant Management:** CRUD data stand tenant dilengkapi dengan Soft Delete & Restore (`/admin/tenants`).
* **F-ADM-04 Master Data User & Role Management:** CRUD pengguna, manajemen role (*Mahasiswa*, *Tenant*, *Admin*), dan Soft Delete & Restore (`/admin/users`).
* **F-ADM-05 Master Payment Settings & Fee:** Pengaturan saluran pembayaran aktif dan biaya layanan aplikasi / Admin Fee (`/admin/payment-settings`).

", "07-ui-ux-guidelines.md": "# UI/UX Guidelines — Smart Canteen FEB

## 1. Core Design Principles

Smart Canteen FEB mengutamakan tampilan yang modern, segar, konsisten, dan memukau (WOW factor) serta dioptimalkan untuk performa demonstrasi demo.

* **Clean & Modern Aesthetic:** Menggunakan palette warna harmonis, rounded corners, subtle shadows, dan tipografi yang jelas.
* **Mobile-First & Responsive:** Antarmuka harus tampil sempurna di layar Smartphone (Mahasiswa yang memesan di kantin) maupun Desktop (Dashboard Admin & Tenant).
* **Clear Feedback & States:** Setiap aksi pengguna (klik tombol, ubah kuantitas, update status) memberikan respon visual yang seketika.

---

## 2. Palette Warna & Visual System

* **Primary Color:** Emerald / Teal / Modern Green (Merepresentasikan kebersihan, kesegaran kantin, dan kemudahan).
* **Secondary / Accent:** Warm Amber / Orange (Merepresentasikan makanan & kehangatan).
* **Neutral Tones:** Dark Slate / Charcoal untuk teks, Light Gray / Ice White untuk background card.
* **Status Badges:**
  - `Menunggu Pembayaran`: Yellow / Amber Badge
  - `Dibayar` / `Diproses`: Blue / Indigo Badge
  - `Siap Diambil`: Emerald / Green Pulse Badge
  - `Selesai`: Neutral Gray Badge
  - `Pembayaran Gagal`: Red Badge

---

## 3. Component & Interactive States

Setiap komponen UI harus mengimplementasikan 4 state utama:

1. **Default State:** Tampilan bersih dengan hirarki visual yang jelas.
2. **Loading State:** Skeleton loader / pulsing animation saat memuat data atau memproses transaksi.
3. **Empty State:** Ilustrasi / pesan ramah jika keranjang kosong, riwayat kosong, atau tidak ada pesanan masuk.
4. **Error / Validation State:** Message error yang informatif jika terjadi kesalahan input atau kegagalan simulasi pembayaran.

---

## 4. Feedback & Notifications

* **Toast Notification:** Pop-up kecil di sudut layar saat pengguna menambahkan item ke keranjang atau berhasil mengubah status pesanan.
* **Confirmation Modals:** Modal konfirmasi sebelum menghapus item dari keranjang atau melakukan aksi pembatalan.
* **Progress Trackers:** Stepper visual yang hidup pada halaman detail pesanan mahasiswa untuk memperlihatkan tahap **Self-Pickup**.

### 2.2 `tenants`

", "09-payment-flow.md": "# Payment Flow & Verification — Smart Canteen FEB

## 1. Dual Payment System Overview

Smart Canteen FEB mendukung 2 metode pembayaran:
1. **Cashless (Midtrans Sandbox):** Pembayaran digital otomatis dengan verifikasi HTTP callback.
2. **Cash (Tunai):** Pembayaran tunai langsung di stand tenant menggunakan **Scan Kode QR / Input Kode Pesanan**.

```mermaid
flowchart TD
    A[\"Checkout Mahasiswa\"] --> B{\"Pilih Metode Pembayaran\"}

    B -->|\"Cashless\"| C[\"Midtrans Sandbox Snap Pop-up\"]
    C --> D[\"Proses Pembayaran Digital\"]
    D --> E[\"Midtrans Webhook Callback\"]
    E --> F[\"Order Status: Dibayar\"]

    B -->|\"Cash Tunai\"| G[\"Generate QR & pickup_code\"]
    G --> H[\"Order Status: Menunggu Pembayaran Tunai\"]
    H --> I[\"Mahasiswa Tunjukkan QR di Stand Tenant\"]
    I --> J[\"Tenant Scan QR / Input Kode\"]
    J --> K[\"Tenant Terima Uang & Konfirmasi\"]
    K --> F
```

---

## 2. Alur Pembayaran Cashless (Midtrans Sandbox)

1. Mahasiswa mengklik \"Bayar Sekarang\" dengan opsi Cashless.
2. Backend me-request Midtrans Snap Token via Midtrans Sandbox API.
3. Midtrans Snap Modal muncul di layar Mahasiswa.
4. Untuk pengujian di lingkungan **Sandbox**:
   - **Saran Utama (BCA Virtual Account)**: [https://simulator.sandbox.midtrans.com/bca/va/index](https://simulator.sandbox.midtrans.com/bca/va/index) *(Praktis: Cukup salin Nomor VA dari Snap tanpa menyalin URL gambar QR)*.
   - **Alternatif (QRIS)**: [https://simulator.sandbox.midtrans.com/v2/qris/index](https://simulator.sandbox.midtrans.com/v2/qris/index).
5. Setelah transaksi dilakukan di Midtrans Simulator, Midtrans mengirimkan HTTP POST Callback Webhook ke `/api/midtrans/notification`.
6. System mengecek signature key dan mengubah status `orders`:
   - `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.

---

## 3. Alur Pembayaran Cash (Scan Kode QR oleh Tenant)

1. Mahasiswa memilih opsi **Cash / Tunai**.
2. System membuat pesanan dengan `payment_method = 'cash'`, `payment_status = 'unpaid'`, dan menghasilkan `pickup_code` unik (cth: `FEB-9912`) & QR Code string.
3. Mahasiswa mendatangi stand tenant di kantin FEB dan menunjukkan Kode QR pada HP-nya.
4. Tenant membuka modal **Scan / Verifikasi Pembayaran Cash** di aplikasi Tenant.
5. Tenant melakukan scan QR via kamera atau mengetik `FEB-9912`.
6. Aplikasi menampilkan rincian tagihan (cth: 2 Nasi Goreng + 1 Es Teh = Rp25.000).
7. Tenant menerima uang fisik dari mahasiswa, lalu mengklik tombol **\"Konfirmasi Terima Pembayaran Tunai\"**.
8. Backend memperbarui status pesanan: `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.
", "10-status-order.md": "# Order Status Machine — Smart Canteen FEB

## 1. State Machine Order Status

Status pesanan pada Smart Canteen FEB mengontrol alur dari awal pembuatan pesanan hingga siap diambil melalui mekanisme **Self-Pickup**.

```mermaid
stateDiagram-v2
    [*] --> MenungguPembayaran

    state MenungguPembayaran {
        [*] --> UnpaidCashless
        [*] --> UnpaidCash
    }

    UnpaidCashless --> Dibayar : Midtrans Callback Success
    UnpaidCash --> Dibayar : Tenant Scan QR & Konfirmasi

    state Dibayar {
        [*] --> Paid
    }

    Dibayar --> Diproses : Tenant Klik Proses Pesanan

    state Diproses {
        [*] --> Processing
    }

    Diproses --> SiapDiambil : Tenant Klik Siap Diambil

    state SiapDiambil {
        [*] --> ReadyForPickup
    }

    SiapDiambil --> Selesai : Mahasiswa Ambil & Tenant Konfirmasi

    state Selesai {
        [*] --> Completed
    }
```

---

## 2. Status & Timestamps Audit Matrix

| Status | Label UI | Trigger Cashless | Trigger Cash | Updated Timestamp |
| :--- | :--- | :--- | :--- | :--- |
| `pending` | **Menunggu Pembayaran** | Order Created | Order Created | `created_at` |
| `paid` | **Dibayar** | Midtrans Webhook Callback | Tenant Scan QR & Confirm | `paid_at` |
| `processing` | **Diproses** | Tenant Action | Tenant Action | `processing_at` |
| `ready` | **Siap Diambil** | Tenant Action | Tenant Action | `ready_at` |
| `completed` | **Selesai** | Tenant / Mahasiswa Action | Tenant / Mahasiswa Action | `completed_at` |
| `failed` | **Gagal** | Midtrans Expired/Denied | Tenant Cancel | - |

", "13-development-rules.md": "# Development Rules

## 1. Scope First

Semua implementasi HARUS mengikuti dokumen di folder `docs/`.

Jangan menambahkan fitur baru hanya karena fitur tersebut dianggap umum,
bagus, modern, atau dibutuhkan oleh aplikasi production.

Jika sebuah fitur tidak tercantum dalam scope, jangan implementasikan.

## 2. Project Type

Project ini adalah:

- Website dummy/demo
- Bukan production system
- Fokus pada UI dan demo flow
- Fokus pada alur utama Smart Canteen FEB

Jangan mengembangkan sistem menjadi platform production yang kompleks.

## 3. Feature Addition

Jika requirement baru ditemukan:

1. Cek apakah requirement tersebut ada di `docs/`.
2. Jika tidak ada, jangan langsung implementasikan.
3. Tandai sebagai OUT OF SCOPE.
4. Minta konfirmasi sebelum mengubah scope.

## 4. Avoid Overengineering

Jangan menambahkan:

- microservices
- queue system yang kompleks
- event-driven architecture yang tidak diperlukan
- caching layer yang kompleks
- analytics
- audit log kompleks
- notification infrastructure
- mobile application
- financial accounting system

kecuali secara eksplisit diminta.

Prioritaskan:

- tampilan rapi

- mudah digunakan
- sesuai desain yang telah disepakati

Jangan membuat halaman tambahan yang tidak diperlukan hanya untuk
\"melengkapi\" aplikasi.

## 6. Payment

Payment hanya digunakan untuk kebutuhan demo/alur pembayaran.

| 4 | **Modul Tenant (Order Board & Menu CRUD)** | 20% | Rp200.000 | Tenant Order Status Board (`Dibayar` $\rightarrow$ `Diproses` $\rightarrow$ `Siap Diambil`), Category & Menu CRUD (Soft Delete). |
| 5 | **Modul Admin & Final Polish** | 15% | Rp150.000 | Admin Supervision Dashboard, Master Data Management, Responsive Mobile & Desktop polish. |
| **TOTAL** | | **100%** | **Rp1.000.000** | **Website Demo Ready Smart Canteen FEB** |
"};Null | **Snapshot Harga Satuan** |\n| `quantity` | Integer | Not Null | Jumlah item |\n| `subtotal` | Decimal(12,2) | Not Null | Quantity x Price |\n", "09-payment-flow.md": "# Payment Flow & Verification — Smart Canteen FEB\n\n## 1. Dual Payment System Overview\n\nSmart Canteen FEB mendukung 2 metode pembayaran:\n1. **Cashless (Midtrans Sandbox):** Pembayaran digital otomatis dengan verifikasi HTTP callback.\n2. **Cash (Tunai):** Pembayaran tunai langsung di stand tenant menggunakan **Scan Kode QR / Input Kode Pesanan**.\n\n```mermaid\nflowchart TD\n    A[\"Checkout Mahasiswa\"] --> B{\"Pilih Metode Pembayaran\"}\n\n    B -->|\"Cashless\"| C[\"Midtrans Sandbox Snap Pop-up\"]\n    C --> D[\"Proses Pembayaran Digital\"]\n    D --> E[\"Midtrans Webhook Callback\"]\n    E --> F[\"Order Status: Dibayar\"]\n\n    B -->|\"Cash Tunai\"| G[\"Generate QR & pickup_code\"]\n    G --> H[\"Order Status: Menunggu Pembayaran Tunai\"]\n    H --> I[\"Mahasiswa Tunjukkan QR di Stand Tenant\"]\n    I --> J[\"Tenant Scan QR / Input Kode\"]\n    J --> K[\"Tenant Terima Uang & Konfirmasi\"]\n    K --> F\n```\n\n---\n\n## 2. Alur Pembayaran Cashless (Midtrans Sandbox)\n\n1. Mahasiswa mengklik \"Bayar Sekarang\" dengan opsi Cashless.\n2. Backend me-request Midtrans Snap Token via Midtrans Sandbox API.\n3. Midtrans Snap Modal muncul di layar Mahasiswa.\n4. Setelah transaksi dilakukan di Midtrans Simulator, Midtrans mengirimkan HTTP POST Callback Webhook ke `/api/midtrans/notification`.\n5. System mengecek signature key dan mengubah status `orders`:\n   - `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.\n\n---\n\n## 3. Alur Pembayaran Cash (Scan Kode QR oleh Tenant)\n\n1. Mahasiswa memilih opsi **Cash / Tunai**.\n2. System membuat pesanan dengan `payment_method = 'cash'`, `payment_status = 'unpaid'`, dan menghasilkan `pickup_code` unik (cth: `FEB-9912`) & QR Code string.\n3. Mahasiswa mendatangi stand tenant di kantin FEB dan menunjukkan Kode QR pada HP-nya.\n4. Tenant membuka modal **Scan / Verifikasi Pembayaran Cash** di aplikasi Tenant.\n5. Tenant melakukan scan QR via kamera atau mengetik `FEB-9912`.\n6. Aplikasi menampilkan rincian tagihan (cth: 2 Nasi Goreng + 1 Es Teh = Rp25.000).\n7. Tenant menerima uang fisik dari mahasiswa, lalu mengklik tombol **\"Konfirmasi Terima Pembayaran Tunai\"**.\n8. Backend memperbarui status pesanan: `status = 'paid'`, `payment_status = 'paid'`, `paid_at = now()`.\n", "10-status-order.md": "# Order Status Machine — Smart Canteen FEB\n\n## 1. State Machine Order Status\n\nStatus pesanan pada Smart Canteen FEB mengontrol alur dari awal pembuatan pesanan hingga siap diambil melalui mekanisme **Self-Pickup**.\n\n```mermaid\nstateDiagram-v2\n    [*] --> MenungguPembayaran\n\n    state MenungguPembayaran {\n        [*] --> UnpaidCashless\n        [*] --> UnpaidCash\n    }\n\n    UnpaidCashless --> Dibayar : Midtrans Callback Success\n    UnpaidCash --> Dibayar : Tenant Scan QR & Konfirmasi\n\n    state Dibayar {\n        [*] --> Paid\n    }\n\n    Dibayar --> Diproses : Tenant Klik Proses Pesanan\n\n    state Diproses {\n        [*] --> Processing\n    }\n\n    Diproses --> SiapDiambil : Tenant Klik Siap Diambil\n\n    state SiapDiambil {\n        [*] --> ReadyForPickup\n    }\n\n    SiapDiambil --> Selesai : Mahasiswa Ambil & Tenant Konfirmasi\n\n    state Selesai {\n        [*] --> Completed\n    }\n```\n\n---\n\n## 2. Status & Timestamps Audit Matrix\n\n| Status | Label UI | Trigger Cashless | Trigger Cash | Updated Timestamp |\n| :--- | :--- | :--- | :--- | :--- |\n| `pending` | **Menunggu Pembayaran** | Order Created | Order Created | `created_at` |\n| `paid` | **Dibayar** | Midtrans Webhook Callback | Tenant Scan QR & Confirm | `paid_at` |\n| `processing` | **Diproses** | Tenant Action | Tenant Action | `processing_at` |\n| `ready` | **Siap Diambil** | Tenant Action | Tenant Action | `ready_at` |\n| `completed` | **Selesai** | Tenant / Mahasiswa Action | Tenant / Mahasiswa Action | `completed_at` |\n| `failed` | **Gagal** | Midtrans Expired/Denied | Tenant Cancel | - |\n", "11-demo-scenarios.md": "# Demo Scenarios — Smart Canteen FEB\n\nDokumen ini berisi langkah-langkah pengujian (Walkthrough Test Script) untuk mendemonstrasikan sistem Smart Canteen FEB kepada penguji / stakeholder.\n\n---\n\n## 1. Demo Scenarios Flow\n\n```mermaid\nflowchart LR\n    S1[Skenario 1: Cashless Midtrans] --> S2[Skenario 2: Cash QR Scan]\n    S2 --> S3[Skenario 3: Soft Delete & Menu Kategori]\n    S3 --> S4[Skenario 4: Admin Supervision]\n```\n\n---\n\n## 2. Langkah-Langkah Skenario Demo\n\n### Skenario 1: Pemesanan Cashless (Midtrans Sandbox)\n1. Mahasiswa login (`mahasiswa@feb.ac.id`), pilih Tenant & Menu.\n2. Tambahkan ke keranjang $\\rightarrow$ Checkout $\\rightarrow$ Pilih **Cashless**.\n3. Selesaikan pembayaran di Pop-up Midtrans Sandbox.\n4. Status otomatis ter-update menjadi **\"Dibayar\"** dan pesanan muncul di Dashboard Tenant.\n\n### Skenario 2: Pemesanan Cash (Scan QR oleh Tenant)\n1. Mahasiswa buat pesanan baru $\\rightarrow$ Checkout $\\rightarrow$ Pilih **Cash / Tunai**.\n2. Aplikasi menampilkan **Kode QR & Pickup Code** (cth: `FEB-8821`).\n3. Pada tab Tenant (`tenant@feb.ac.id`), buka **Scan QR / Input Kode Pembayaran**.\n4. Scan / ketik `FEB-8821` $\\rightarrow$ Klik **Konfirmasi Terima Pembayaran Tunai**.\n5. Status otomatis berubah menjadi **\"Dibayar\"** $\\rightarrow$ Tenant memproses pesanan hingga **\"Siap Diambil\"** $\\rightarrow$ **\"Selesai\"**.\n\n### Skenario 3: Demonstrasi Soft Delete & Kategori Menu\n1. Tenant menambah/menghapus menu ber-kategori.\n2. Saat menu di-soft delete, riwayat pesanan lama mahasiswa **tetap aman dan konsisten** karena menggunakan snapshot & SoftDeletes.\n\n### Skenario 4: Admin Supervision\n1. Admin login (`admin@feb.ac.id`), memantau rasio pembayaran Cash vs Cashless dan kelola data master (Tenant & User dengan Soft Delete).\n", "12-technical-guidelines.md": "# Technical Guidelines — Smart Canteen FEB\n\nDokumen ini mendefinisikan arsitektur teknis, stack teknologi, konvensi kode, dan panduan pengembangan aplikasi Smart Canteen FEB.\n\n---\n\n## 1. Stack Teknologi\n\n```mermaid\nflowchart TD\n    subgraph Frontend[\"Frontend Layer (SPA)\"]\n        React[\"React 18 / JSX\"]\n        Inertia[\"Inertia.js v3\"]\n        Tailwind[\"Tailwind CSS\"]\n        Wayfinder[\"Laravel Wayfinder (Typed Routes)\"]\n    end\n\n    subgraph Backend[\"Backend Layer (Laravel Framework)\"]\n        PHP[\"PHP 8.4\"]\n        Laravel[\"Laravel 12 Framework\"]\n        Fortify[\"Laravel Fortify (Auth Engine)\"]\n        Spatie[\"Spatie Laravel Permission\"]\n        Midtrans[\"Midtrans PHP SDK\"]\n    end\n\n    subgraph Database[\"Data Layer\"]\n        MySQL[\"SQLite / MySQL Database\"]\n    end\n\n    Frontend <-->|\"Inertia Protocol & JSON\"| Backend\n    Backend <--> Database\n    Backend <-->|\"HTTP API / Webhooks\"| Midtrans\n```\n\n---\n\n## 2. Dependensi Utama (Composer & NPM)\n\n### PHP Packages (Composer)\n* `laravel/framework`: ^12.0\n* `inertiajs/inertia-laravel`: ^2.0 / v3\n* `laravel/fortify`: Authentication backend\n* `spatie/laravel-permission`: ^8.3 (Manajemen Role & Permisi)\n* `midtrans/midtrans-php`: Integrasi SDK Pembayaran Midtrans Sandbox\n* `laravel/wayfinder`: Auto-generate TypeScript/JS routes\n\n### JS Packages (NPM)\n* `@inertiajs/react`: Interaksi Client-side React dengan Inertia\n* `react` & `react-dom`: Library UI Rendering\n* `tailwindcss` & `@tailwindcss/vite`: Utility-first CSS styling\n\n---\n\n## 3. Struktur Direktori & Konvensi Kode\n\n* **Controller:** Disimpan di `app/Http/Controllers/`. Controller harus tipis (slim controllers), mengembalikan `Inertia::render('PageName', $props)`.\n* **Model:** Disimpan di `app/Models/`. Menggunakan Laravel Eloquent dengan typehints PHP 8.4.\n* **React Pages:** Disimpan di `resources/js/pages/`.\n  - `resources/js/pages/Mahasiswa/`: Halaman khusus flow mahasiswa.\n  - `resources/js/pages/Tenant/`: Halaman dashboard & pesanan tenant.\n  - `resources/js/pages/Admin/`: Halaman dashboard & master data admin.\n* **Components:** Component reusable disimpan di `resources/js/components/`.\n\n---\n\n## 4. Perintah Utama Development\n\n```bash\n# Menjalankan server backend Laravel\nphp artisan serve\n\n# Menjalankan Vite dev server frontend\nnpm run dev\n\n# Format kode PHP otomatis\nvendor/bin/pint --format agent\n\n# Regenerate Wayfinder typed routes\nphp artisan wayfinder:generate\n```\n", "13-development-rules.md": "# Development Rules\n\n## 1. Scope First\n\nSemua implementasi HARUS mengikuti dokumen di folder `docs/`.\n\nJangan menambahkan fitur baru hanya karena fitur tersebut dianggap umum,\nbagus, modern, atau dibutuhkan oleh aplikasi production.\n\nJika sebuah fitur tidak tercantum dalam scope, jangan implementasikan.\n\n## 2. Project Type\n\nProject ini adalah:\n\n- Website dummy/demo\n- Bukan production system\n- Fokus pada UI dan demo flow\n- Fokus pada alur utama Smart Canteen FEB\n\nJangan mengembangkan sistem menjadi platform production yang kompleks.\n\n## 3. Feature Addition\n\nJika requirement baru ditemukan:\n\n1. Cek apakah requirement tersebut ada di `docs/`.\n2. Jika tidak ada, jangan langsung implementasikan.\n3. Tandai sebagai OUT OF SCOPE.\n4. Minta konfirmasi sebelum mengubah scope.\n\n## 4. Avoid Overengineering\n\nJangan menambahkan:\n\n- microservices\n- queue system yang kompleks\n- event-driven architecture yang tidak diperlukan\n- caching layer yang kompleks\n- analytics\n- audit log kompleks\n- notification infrastructure\n- mobile application\n- financial accounting system\n\nkecuali secara eksplisit diminta.\n\n## 5. UI\n\nPrioritaskan:\n\n- tampilan rapi\n- responsive\n- konsisten\n- mudah digunakan\n- sesuai desain yang telah disepakati\n\nJangan membuat halaman tambahan yang tidak diperlukan hanya untuk\n\"melengkapi\" aplikasi.\n\n## 6. Payment\n\nPayment hanya digunakan untuk kebutuhan demo/alur pembayaran.\n\nJangan mengembangkan sistem payment production-grade di luar scope.", "14-out-of-scope.md": "# Out of Scope\n\nFitur berikut TIDAK termasuk dalam proyek:\n\n- Mobile application\n- Native Android/iOS application\n- Sistem keuangan\n- Laporan keuangan kompleks\n- Accounting\n- Settlement system\n- Sistem inventory kompleks\n- Integrasi POS\n- Integrasi sistem kampus\n- WhatsApp notification\n- SMS notification\n- Email notification infrastructure\n- Push notification\n- Real-time infrastructure kompleks\n- Multi-campus management\n- Loyalty program\n- Voucher system kompleks\n- Membership system\n- Advanced analytics\n- Advanced reporting\n- Production-grade payment infrastructure\n- Infrastructure scaling\n- DevOps pipeline kompleks\n- Kubernetes\n- Microservices\n- AI recommendation\n- Machine learning\n- Fitur lain yang tidak tercantum dalam scope\n\nJika fitur tersebut dibutuhkan, fitur dianggap sebagai\nCHANGE REQUEST / OUT OF SCOPE dan harus mendapat persetujuan terlebih dahulu.", "15-acceptance-criteria.md": "# Acceptance Criteria — Smart Canteen FEB\n\n## 1. Quality Gate Overview\n\n```mermaid\nflowchart TD\n    AC1[1. Dual Payment: Cashless & Cash QR Scan] --> GATE{Definition of Done}\n    AC2[2. Soft Deletes pada User, Tenant, Menu, Order] --> GATE\n    AC3[3. Kategori Menu & Snapshot Order Items] --> GATE\n    AC4[4. Self-Pickup Tracker & Timestamps] --> GATE\n    AC5[5. Admin & Tenant Dashboard Supervision] --> GATE\n    GATE -- Pass All --> PASSED[PROYEK DEMO ACC / SELESAI]\n```\n\n---\n\n## 2. Checklist Acceptance Criteria\n\n* [ ] Mahasiswa dapat memilih pembayaran **Cashless** (Midtrans Sandbox) atau **Cash** (Tunai di Stand).\n* [ ] Mahasiswa menerima Kode QR & string `pickup_code` unik untuk setiap transaksi.\n* [ ] Tenant memiliki fitur **Scan Kode QR / Input Kode** untuk mengonfirmasi pembayaran tunai.\n* [ ] Model `User`, `Tenant`, `Menu`, dan `Order` mengimplementasikan Trait `SoftDeletes` (`deleted_at`).\n* [ ] Model `OrderItem` menyimpan `menu_name` dan `price` sebagai snapshot saat transaksi dibuat.\n* [ ] Tenant dapat mengelompokkan menu berdasarkan `Category`.\n* [ ] Status pesanan mengupdate timestamp audit (`paid_at`, `processing_at`, `ready_at`, `completed_at`).\n* [ ] Seluruh alur demo berjalan lancar tanpa merusak data historis.\n", "16-rab.md": "# Rencana Anggaran Biaya (RAB) — Smart Canteen FEB\n\nDokumen ini merincikan alokasi anggaran biaya (Rp1.000.000) dan estimasi pengerjaan (5–7 Hari Kerja) untuk pengembangan Website Demo Smart Canteen FEB.\n\n---\n\n## 1. Timeline & Budget Breakdown\n\n```mermaid\n%%{init: { \"gantt\": { \"leftPadding\": 160, \"useWidth\": 900 } } }%%\ngantt\n    title Timeline Pengerjaan Smart Canteen FEB (5-7 Hari)\n    dateFormat  YYYY-MM-DD\n    axisFormat  %d %b\n    tickInterval 1day\n    section Phase 1: Planning & Setup\n    Doc & DB Schema with SoftDeletes  :active, p1, 2026-09-18, 1d\n    section Phase 2: Core & Dual Payment\n    Auth & Category Menu Setup        :p2, after p1, 1d\n    Cart & Checkout (Cash vs Cashless):p3, after p2, 1d\n    Midtrans Sandbox & Cash QR Scan   :p4, after p3, 2d\n    section Phase 3: Tenant & Admin\n    Tenant QR Scanner & Order Board   :p5, after p4, 1d\n    Admin Dashboard & Final Polish    :p6, after p5, 1d\n```\n\n---\n\n## 2. Rincian Alokasi Biaya (Rp1.000.000)\n\n| No | Modul / Komponen Pekerjaan | Bobot (%) | Biaya (IDR) | Output / Deliverables |\n| :--- | :--- | :---: | :---: | :--- |\n| 1 | **Setup Architecture, DB Schema & SoftDeletes** | 15% | Rp150.000 | Core setup Laravel 12 + Inertia React, Spatie Roles, Migration with SoftDeletes & Categories. |\n| 2 | **Modul Mahasiswa (Katalog Kategori & Checkout)** | 25% | Rp250.000 | Katalog Menu per Kategori, Cart, Checkout pilihan Cashless / Cash, Digital QR Code display. |\n| 3 | **Dual Payment Engine (Midtrans & Cash QR Scan)**| 25% | Rp250.000 | Midtrans Sandbox integration + Tenant QR Code Scanner / Input Code Verifier for Cash payment. |\n| 4 | **Modul Tenant (Order Board & Menu CRUD)** | 20% | Rp200.000 | Tenant Order Status Board (`Dibayar` $\\rightarrow$ `Diproses` $\\rightarrow$ `Siap Diambil`), Category & Menu CRUD (Soft Delete). |\n| 5 | **Modul Admin & Final Polish** | 15% | Rp150.000 | Admin Supervision Dashboard, Master Data Management, Responsive Mobile & Desktop polish. |\n| **TOTAL** | | **100%** | **Rp1.000.000** | **Website Demo Ready Smart Canteen FEB** |\n"};
    const filenames = Object.keys(docsData).sort();

    const docIcons = {
      "00-project-overview.md": "fa-compass",
      "01-scope.md": "fa-bullseye",
      "02-requirements.md": "fa-list-check",
      "03-user-flow.md": "fa-diagram-project",
      "04-user-roles.md": "fa-user-shield",
      "05-feature-specification.md": "fa-cubes",
      "06-page-specification.md": "fa-laptop-code",
      "07-ui-ux-guidelines.md": "fa-palette",
      "08-data-model.md": "fa-database",
      "09-payment-flow.md": "fa-credit-card",
      "10-status-order.md": "fa-timeline",
      "11-demo-scenarios.md": "fa-flask",
      "12-technical-guidelines.md": "fa-code",
      "13-development-rules.md": "fa-gavel",
      "14-out-of-scope.md": "fa-ban",
      "15-acceptance-criteria.md": "fa-circle-check",
      "16-rab.md": "fa-calculator"
    };

    let currentFile = filenames[0];

    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    
    function initTheme() {
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.add('dark');
        themeIcon.className = 'fa-solid fa-moon';
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      if (document.documentElement.classList.contains("dark")) {
        document.documentElement.classList.remove("dark");
        localStorage.theme = "light";
        themeIcon.className = "fa-solid fa-sun";
      } else {
        document.documentElement.classList.add("dark");
        localStorage.theme = "dark";
        themeIcon.className = "fa-solid fa-moon";
      }
      renderMermaid();
    });

    initTheme();

    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");

    function toggleMobileMenu() {
      sidebar.classList.toggle("-translate-x-full");
      backdrop.classList.toggle("hidden");
    }

    mobileMenuBtn.addEventListener("click", toggleMobileMenu);
    backdrop.addEventListener("click", toggleMobileMenu);

    function formatTitle(filename) {
      const nameWithoutExt = filename.replace(".md", "");
      const parts = nameWithoutExt.split("-");
      const num = parts[0];
      const title = parts.slice(1).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
      return { num, title };
    }

    const navContainer = document.getElementById("doc-nav");
    
    function renderNav(filter = "") {
      navContainer.innerHTML = "";
      filenames.forEach(fn => {
        const { num, title } = formatTitle(fn);
        if (filter && !title.toLowerCase().includes(filter.toLowerCase()) && !fn.includes(filter.toLowerCase())) {
          return;
        }

        const btn = document.createElement("button");
        const isActive = fn === currentFile;
        const iconClass = docIcons[fn] || "fa-file";

        btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium flex items-center gap-3 transition-all ${
          isActive 
            ? "bg-emerald-600 text-white shadow-md shadow-emerald-500/20 font-semibold" 
            : "text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70"
        }`;

        btn.innerHTML = `
          <i class="fa-solid ${iconClass} text-sm ${isActive ? "text-white" : "text-slate-400 dark:text-slate-500"}"></i>
          <span class="truncate flex-1">${num}. ${title}</span>
        `;

        btn.addEventListener("click", () => {
          window.location.hash = fn;
          if (!sidebar.classList.contains("-translate-x-full")) {
            toggleMobileMenu();
          }
        });

        navContainer.appendChild(btn);
      });
    }

    function renderDoc(filename) {
      if (!docsData[filename]) filename = filenames[0];
      currentFile = filename;

      const { num, title } = formatTitle(filename);
      document.getElementById("current-filename").innerText = filename;
      document.getElementById("current-title").innerText = `${num}. ${title}`;

      const rawMd = docsData[filename];
      const htmlContent = marked.parse(rawMd);

      const container = document.getElementById("markdown-container");
      container.innerHTML = htmlContent;

      // Transform <pre><code class="language-mermaid"> into <div class="mermaid-wrapper"><div class="mermaid">
      container.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid').forEach((block) => {
        const pre = block.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-wrapper';
        
        const innerDiv = document.createElement('div');
        innerDiv.className = 'mermaid';
        innerDiv.textContent = block.textContent;
        
        wrapper.appendChild(innerDiv);
        pre.replaceWith(wrapper);
      });

      renderMermaid();
      renderNav();
      updatePagination();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderMermaid() {
      setTimeout(() => {
        const isDark = document.documentElement.classList.contains("dark");
        mermaid.initialize({
          startOnLoad: false,
          theme: isDark ? "dark" : "default",
          securityLevel: "loose",
          fontFamily: "Inter, sans-serif",
          gantt: {
            useWidth: 950,
            leftPadding: 160,
            rightPadding: 40,
            barHeight: 28,
            barGap: 8,
            topPadding: 45,
            sidePadding: 40,
            fontSize: 12
          },
          flowchart: { useMaxWidth: true, htmlLabels: true },
          sequence: { useMaxWidth: true, showSequenceNumbers: true }
        });

        document.querySelectorAll(".mermaid").forEach((el, index) => {
          const code = el.getAttribute("data-raw") || el.textContent;
          el.setAttribute("data-raw", code);
          el.removeAttribute("data-processed");
          el.innerHTML = code;
          
          try {
            mermaid.run({ nodes: [el] });
          } catch(e) {
            console.error("Mermaid error:", e);
          }
        });
      }, 50);
    }

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const prevLabel = document.getElementById("prev-label");
    const nextLabel = document.getElementById("next-label");

    function updatePagination() {
      const idx = filenames.indexOf(currentFile);
      
      if (idx > 0) {
        prevBtn.disabled = false;
        const prevFn = filenames[idx - 1];
        const { title } = formatTitle(prevFn);
        prevLabel.innerText = title;
        prevBtn.onclick = () => window.location.hash = prevFn;
      } else {
        prevBtn.disabled = true;
        prevLabel.innerText = "Sebelumnya";
      }

      if (idx < filenames.length - 1) {
        nextBtn.disabled = false;
        const nextFn = filenames[idx + 1];
        const { title } = formatTitle(nextFn);
        nextLabel.innerText = title;
        nextBtn.onclick = () => window.location.hash = nextFn;
      } else {
        nextBtn.disabled = true;
        nextLabel.innerText = "Selanjutnya";
      }
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });
    document.getElementById("mobile-search-input").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    document.getElementById("copy-markdown-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(docsData[currentFile]);
      const btn = document.getElementById("copy-markdown-btn");
      btn.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i><span>Tersalin!</span>`;
      setTimeout(() => {
        btn.innerHTML = `<i class="fa-regular fa-copy"></i><span>Salin Raw</span>`;
      }, 2000);
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace("#", "");
      if (filenames.includes(hash)) {
        renderDoc(hash);
      }
    });

    const initialHash = window.location.hash.replace("#", "");
    if (filenames.includes(initialHash)) {
      renderDoc(initialHash);
    } else {
      renderDoc(filenames[0]);
    }
  </script>
